severity: warning
enforcement:
  type: deterministic
  checker: style_lint
rule:
  style_lint:
    tool: ruff
    codes: [E501]
message: 夹具规则（第二份）命中：单行超过 100 列（Ruff E501）。
source:
  kind: project-policy
  path: tests/fixtures/final_tree_gate/source.md
  note: C3 最终树门禁的夹具规则；不是项目规范。
