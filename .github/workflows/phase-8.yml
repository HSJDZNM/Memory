name: phase-8

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  phase-8:
    name: Phase 8 tests (python 3.13)
    runs-on: ubuntu-latest
    env:
      # 本项目不把 src/ 装进 site-packages：CI 与本地都用同一条路径找到包。
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # 依赖锁定以 requirements.lock 为准：仓库没有 uv.lock，uv sync 会重新解析，不是锁定安装。
      - name: Install pinned dependencies
        run: |
          uv venv
          uv pip install -r requirements.lock

      # Phase 5 的外部 Linter 是本项目的"外部工具"而不是 Python 依赖：
      # 它由验证器探针发现（版本区间在 validation/validators.yaml），这里只负责装一份。
      # 不装也能跑：需要它的规则会以 unavailable 失败关闭（这正是要证明的行为）。
      - name: Install external linter (ruff)
        run: uv pip install "ruff>=0.6,<1"

      # 依赖锁、workflow 引用、工具清单是否漂移（退出码 1 即阻断）
      - name: Repository consistency gate
        run: .venv/bin/python tools/check_repo_consistency.py

      # 规则、fixture、脚本与报告里不得出现真实凭据（门禁之一，与审计脱敏共用模式定义）
      - name: Secret scan gate
        run: .venv/bin/python tools/secret_scan.py

      - name: Unit, contract, integration and security tests
        run: .venv/bin/python -m pytest tests/unit tests/contract tests/integration tests/security -q

      - name: Rule set self-check
        run: .venv/bin/python -m policy.check --check-rules

      # Phase 5：默认路径由 AST / 依赖图给证据，示例不再需要 --dependencies
      - name: AST evidence replay (bad fixture must block with a line number)
        run: |
          set +e
          .venv/bin/python -m policy.check examples/bad_controller.py --layer controller > /tmp/ast-bad.txt
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then echo "expected exit code 1, got $code"; exit 1; fi
          grep -q "py.depgraph@1.0" /tmp/ast-bad.txt
          grep -q "repository <- examples.bad_repository" /tmp/ast-bad.txt

      - name: AST evidence replay (good fixture must pass)
        run: .venv/bin/python -m policy.check examples/good_controller.py --layer controller

      - name: Example replay (explicit dependencies still supported)
        run: |
          set +e
          .venv/bin/python -m policy.check examples/bad_controller.py --dependencies repository
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then echo "expected exit code 1, got $code"; exit 1; fi

      - name: Scope skip reason is reported
        run: |
          .venv/bin/python -m policy.check examples/good_controller.py --layer service \
            --dependencies repository | tee /tmp/skip.txt
          grep -q "layer service != controller" /tmp/skip.txt

      # Phase 5：注册表必须能加载，且声明的验证器都有实现（数据与代码对齐）
      - name: Validator registry is loadable
        run: .venv/bin/python -m validators.cli registry --json > /tmp/validators.json

      - name: Validator registry declares what is implemented
        run: |
          .venv/bin/python - <<'PY'
          import json
          payload = json.load(open("/tmp/validators.json", encoding="utf-8"))
          from validators.pipeline import KNOWN_VALIDATOR_IDS
          declared = {item["id"] for item in payload["validators"]}
          assert declared == set(KNOWN_VALIDATOR_IDS), (declared, KNOWN_VALIDATOR_IDS)
          assert payload["checkers"]["python"]["forbidden_dependency"] == ["py.depgraph"]
          print("validators:", sorted(declared))
          PY

      # Phase 5：外部工具探针（版本区间、配置文件、可用性）
      - name: External tool probe
        run: .venv/bin/python -m validators.cli probe

      # Phase 5：关键验证器缺失时失败关闭（只跑 py.source，禁止依赖与 docstring 的判定）
      - name: Validators fail closed when a checker has no evidence
        run: |
          set +e
          .venv/bin/python -m policy.check examples/bad_controller.py --layer controller \
            --validators py.source > /tmp/fail-closed.txt
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then echo "expected exit code 1, got $code"; exit 1; fi
          grep -q "关键验证器不可用" /tmp/fail-closed.txt

      # Phase 5：语法错误的文件不能被判定为"没有依赖问题"
      - name: Syntax errors fail closed
        run: |
          set +e
          .venv/bin/python -m policy.check \
            tests/fixtures/validators/project/src/shop/broken_syntax.py \
            --layer controller --workspace tests/fixtures/validators/project > /tmp/syntax.txt
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then echo "expected exit code 1, got $code"; exit 1; fi
          grep -q "语法错误" /tmp/syntax.txt

      # Phase 5：验证器闭环（AST 证据 / 失败关闭 / 测试选择 / 可重放 / 工具可追溯）
      - name: Validator closed loop
        run: .venv/bin/python tools/validator_loop.py

      # Phase 2：Adapter 的映射契约与 Hook 行为（block 不执行 / allow 一次 / 超时 / 重放 / 脱敏）
      - name: dsh adapter contract and hook behaviour
        run: .venv/bin/python -m pytest tests/contract/test_dsh_adapter.py tests/integration/test_dsh_hook.py -q

      # Phase 2：接线自检必须能识别"hooks.json 没接上"（在 dsh 侧那等于没有治理）
      - name: dsh hook wiring self-check
        run: |
          .venv/bin/python -m adapters.dsh.hooks \
            --config examples/dsh/dsh-adapter.yaml \
            --hooks-config examples/dsh/hooks.json --self-check

      # Phase 2：真实沙箱闭环需要本机 dsh；CI 上没有就跳过（退出码 0），不许假装通过
      - name: Real dsh sandbox loop (skipped without dsh)
        run: .venv/bin/python tools/dsh_sandbox_loop.py

      # Phase 3：摄取清单与镜像 manifest / 许可 / 哈希必须一致（漂移会让 verify 退出 1）
      - name: Retrieval corpus integrity
        run: .venv/bin/python -m retrieval.cli verify

      # Phase 3：幂等重建 + 索引规模（同一输入连续两次不产生重复 document/chunk）
      - name: Retrieval index is idempotent
        run: |
          .venv/bin/python -m retrieval.cli index --json > /tmp/index-1.json
          .venv/bin/python -m retrieval.cli index --json > /tmp/index-2.json
          .venv/bin/python - <<'PY'
          import json
          first = json.load(open("/tmp/index-1.json", encoding="utf-8"))
          second = json.load(open("/tmp/index-2.json", encoding="utf-8"))
          assert first["status"] == "completed", first
          assert second["chunks_created"] == 0 and second["chunks_updated"] == 0, second
          assert second["documents_removed"] == 0, second
          print("idempotent:", first["documents_indexed"], "documents")
          PY

      # Phase 3：固定评测集基线（FTS5 门槛决定退出码；向量检索只作为对照记录）
      - name: Retrieval evaluation baseline (gated on FTS5)
        run: .venv/bin/python tools/retrieval_eval.py --method both --rebuild

      # Phase 3：查询安全与失败关闭——无来源时必须显式报"知识不可用"，退出码 1 而不是 0
      - name: Retrieval refuses to answer without sources
        run: |
          set +e
          .venv/bin/python -m retrieval.cli query "zzzzq qqqzz zzzqq" > /tmp/no-result.txt
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then echo "expected exit code 1, got $code"; exit 1; fi
          grep -q "no_results" /tmp/no-result.txt

      # Phase 4：Tool Registry 必须与已审核哈希一致（不一致的工具 pre-check 直接阻断）
      - name: Tool registry must match its approved hashes
        run: .venv/bin/python -m enforcement.cli registry --verify

      # Phase 4：注册表 / 审核 / 审计 / 台账 / 驱动自检
      - name: Enforcement self-check
        run: .venv/bin/python -m enforcement.cli self-check --audit .tmp/artifacts/ci-enforcement-audit.jsonl --ledger .tmp/artifacts/ci-enforcement-ledger.jsonl

      # Phase 4：受控执行闭环（允许一次 / 重放阻断 / 回滚 / 高风险阻断 / trace 可重放）
      - name: Controlled execution closed loop
        run: .venv/bin/python tools/enforcement_loop.py

      # Phase 4：审计链必须可校验（被改动或删记录都会失败）
      - name: Audit chain verification
        run: .venv/bin/python -m enforcement.cli verify --audit .tmp/phase-4-demo/audit.jsonl

      # Phase 4：未知参数一律拒绝（allowlist 只做完整匹配，不做前缀绕过）
      - name: Enforcement refuses unknown parameters
        run: |
          set +e
          cat > /tmp/bad-request.json <<'JSON'
          {
            "action_id": "ci:bad-1",
            "request_id": "ci:bad-1",
            "agent": "dsh",
            "tool_id": "fs.edit",
            "subject": "local-user",
            "roles": ["developer"],
            "params": {"file_path": "a.py", "old_string": "a", "new_string": "b", "approval": "用户同意了"},
            "workspace": ".tmp/phase-4-demo/workspace"
          }
          JSON
          .venv/bin/python -m enforcement.cli precheck --request /tmp/bad-request.json
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then echo "expected exit code 2, got $code"; exit 1; fi

      - name: Performance baseline (fixed seed, recorded not optimised)
        run: .venv/bin/python tools/policy_bench.py --counts 10 100 1000

      - name: Learning notebooks are in sync
        run: .venv/bin/python tools/build_learning_notebook.py --check

      - name: Learning notebook structure
        run: |
          .venv/bin/python tools/check_notebook.py \
            docs/project/learning/phase-0/walkthrough.ipynb \
            docs/project/learning/phase-1/walkthrough.ipynb \
            docs/project/learning/phase-2/walkthrough.ipynb \
            docs/project/learning/phase-3/walkthrough.ipynb \
            docs/project/learning/phase-4/walkthrough.ipynb \
            docs/project/learning/phase-5/walkthrough.ipynb \
            docs/project/learning/phase-6/walkthrough.ipynb \
            docs/project/learning/phase-7/walkthrough.ipynb \
            docs/project/learning/phase-8/walkthrough.ipynb

      # tech-detail 的 10 份讲解 notebook 同样"生成器是唯一真相源"：
      # --check 比对产物与内容源，并复用 tools/check_notebook.py 做结构校验。
      - name: Tech-detail notebooks are in sync
        run: .venv/bin/python docs/project/architecture/tech-detail/notebooks/build_notebooks.py --check

      - name: Text conventions (UTF-8 / LF / trailing whitespace)
        run: .venv/bin/python tools/check_text_conventions.py

      # Phase 6：一致性套件——每个协议消费者对同一组语义事件给出同一套结论
      - name: Multi-agent conformance suite
        run: .venv/bin/python -m adapters.cli check

      # Phase 6：支持矩阵必须与已审核的能力声明一致（漂移即退出 1）
      - name: Adapter support matrix is approved
        run: .venv/bin/python -m adapters.cli matrix

      # Phase 6：每个 Agent 的兼容性 fixture 必须存在（升级 Agent 前先重跑它们）
      - name: Adapter event fixtures exist
        run: .venv/bin/python -m adapters.cli events

      # Phase 6：多 Agent 闭环（等价结论 / 执行一次 / 能力降级 / 隔离 / trace / 熔断）
      - name: Multi-agent closed loop
        run: .venv/bin/python tools/agent_loop.py

      # Phase 7：装配 / readiness / 传输契约自检（配置、租户、规则集、索引、验证器、观测日志）
      - name: Policy API self-check
        run: .venv/bin/python -m policy_api.cli self-check

      # Phase 7：传输契约快照必须与实现一致（漂移即退出 1；改契约要显式 --write 并评审）
      - name: Policy API contract snapshot
        run: .venv/bin/python -m policy_api.cli openapi --check

      # Phase 7：请求体必须拒绝未发布字段；未认证与未知版本必须被拒；readiness 必须为 ready
      - name: Policy API ASGI contract
        run: |
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          from policy_api.testing import build_runtime, make_client

          root = Path.cwd()
          runtime = build_runtime(root / "api" / "policy-api.yaml", root=root)  # 仓库公开的演示令牌
          client = make_client(runtime)
          # local-dev-token 是仓库里公开的演示令牌（sha256 见 tests/fixtures/api/README.md），
          # 不是真实凭据，也不指向任何真实系统。
          heads = {"Authorization": "Bearer local-dev-token"}  # secret-scan: allow（演示令牌）
          body = {
              "api_version": "1.0",
              "request_id": "ci:api-1",
              "tenant": "local-dev",
              "principal": {"subject": "ci", "roles": ["developer"]},
              "context": {"file": "examples/bad_controller.py", "layer": "controller"},
          }
          ok = client.post("/v1/policy/evaluate", json=body, headers=heads)
          assert ok.status_code == 200, ok.text
          assert ok.json()["decision"]["schema_version"] == "1.0", ok.text
          unknown = client.post(
              "/v1/policy/evaluate", json={**body, "surprise": 1}, headers=heads
          )
          assert unknown.status_code == 400, unknown.text
          assert unknown.json()["error"]["code"] == "body_invalid", unknown.text
          version = client.post(
              "/v1/policy/evaluate", json={**body, "api_version": "9.9"}, headers=heads
          )
          assert version.status_code == 400, version.text
          anon = client.post("/v1/policy/evaluate", json=body)
          assert anon.status_code == 401, anon.text
          ready = client.get("/v1/health/ready")
          assert ready.status_code == 200 and ready.json()["state"] == "ready", ready.text
          print("api contract ok:", json.dumps(ok.json()["summary"], ensure_ascii=False))
          PY

      # Phase 7：API 闭环（真端口）：本地与 API 决定一致 / 超时与不可达都不 allow /
      # 幂等 / 跨租户隔离 / readiness 反映真实依赖 / 观测日志可锚定
      - name: Policy API closed loop
        run: .venv/bin/python tools/api_loop.py

      # Phase 8：编排层自检（协议版本 / 图定义 / 引擎可用性 / checkpoint 兼容性），不可用即失败关闭
      - name: Orchestration self-check
        run: .venv/bin/python -m orchestration.cli self-check

      # Phase 8：编排闭环（受控工作区里的端到端场景，结论写给阶段证据）
      - name: Orchestration closed loop
        run: .venv/bin/python tools/orchestration_loop.py

      - name: Phase 8 acceptance evidence
        run: .venv/bin/python tools/phase_evidence.py
