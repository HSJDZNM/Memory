# 仪器自证（R-h）的检查登记表：**平台自己的仪器**逐条登记 + 逐条说明它凭什么算数。
#
# 谁读它：tools/instrument_self_proof.py（只报告，退出码恒为 0）。它把本表与**四族实际可枚举的
# 对象**双向比对，差集非空即红；每条对象必须至少有 mutation_id（变异自证）或 gap_note（缺口说明）
# 之一。判据与口径写在那个工具的模块 docstring 里，设计稿见 25 号，落地读数见 23 号 §19。
#
# 只放指针（方案 §3.2 原文）：本表**不许**出现 last_run / status / passed / observed_* ——
# 出现即加载期报错（那是运行结果，不是声明）。加载器同时拒绝未知字段、未知枚举、重复 check_id。
# 台阶 5 多了一个**可选**字段 covers_facts（连接键）：它是声明，不是运行结果，可以写。
#
# 四族与实数（**2026-10-06 实跑**，复现：`python tools/instrument_self_proof.py`）：
#   gate_step          42  .github/workflows/*.yml 里带非空 run 块的步骤（学习手册下线删了两步）
#   gap_probe_check    13  tools/governance_gap_probe.py 的 CHECKS（G01–G13，手工仪器，未接进本机门禁）
#   seal_scenario       5  tools/provenance_loop.py 的 SCENARIOS（手工仪器，未接进本机门禁）
#   report_only_step    4  tools/ci_local.py 的 REPORT_ONLY_STEPS（本机门禁的只报告步骤，带到期日；
#                          台阶 5 的 control_plane_facts 已接为第 4 条）
#   合计               64
#   与 tools/instrument_self_proof.py 打印的 objects=64 declared=64 一致；
#   本机执行 / bash-only / 登记豁免的细分随 workflow 变，需要时看 `python tools/ci_local.py --list`。
#   旧读数只作登记、不复用：65 = 44 + 13 + 5 + 3（学习手册还在、control_plane_facts 未接时）；
#   25 号 §1 记的 63 = 44 + 13 + 5 + 1 更早，差 1 是当时只登记了义务门禁一条、漏了豁免到期检查。
#
# gap_note 的统一措辞（方案 A：mutation_id 全空、不做任何变异执行）：**存量检查，未做变异自证**。
# 这条缺口是**显式记账**，不是静默：R-h 的三态判据会把「既没有 mutation_id 又没有 gap_note」
# 的行报红，而本表每一行都写了它——所以今天三态合计 0 命中，读的人同时能看见
# objects.with_mutation_id = 0（这一格不是"变异都验过"，是"没有可评的变异"）。
#
# 字段取值域（加载器逐行校验）：
#   owner           ci-line        = 文件属 CI 线（.github/workflows/*、tools/ci_local.py）
#                   control-plane  = 文件属控制面重构会话（tools/ 下其余脚本）
#   evidence_level  exit_code（退出码 + 日志）/ report（机读读数载荷）/ seal（判据级封条读数）
#   severity        blocking（在 CI 或本机门禁上红了就是失败）/ advisory（手工仪器或只报告步骤）
#   covers_facts    可选：这一行声明覆盖的 facts 表 key（validation/control-plane-facts.yaml）。
#                   省略 = 这一行不声明覆盖任何 fact（不是"覆盖了 0 个"的另一种说法）。
#                   **形态**在加载期查（点分两段以上的 key，畸形即报错）；**存在性**在读数里查
#                   （连接那一格的 check_covers_unknown_fact）——写错一个字母是"连接悬空"，
#                   不是"这张表坏了"（27 号 §3.2 的分工）。
#
# command 是给评审读的**指针**，逐字取自该对象自己的出处：
#   gate 行 = workflow run 块的**第一行**（多行脚本的第一行可能是 set +e 这类控制行，那仍是真值；
#   要看全貌请打开 .github/workflows/phase-8.yml 的 run 块）；probe 行 = 该 check 自己的 --only 调用；
#   seal 行 = 该闭环的调用（它没有单场景开关，5 行因此同一条命令，靠 covers 分辨是哪一个场景）；
#   report-only 行 = ci_local 里那一行的 args。**加载器不比对 command 文本**（比对的是 check_id）。
#
# covers 的口径：能取自对象自己声明的文字就不另写一套——
#   probe 13 行逐字取该 check 的 title，seal 5 行逐字取该场景的 what（都是源码里的字面量）；
#   gate 42 行与 report-only 4 行是短句（步骤名/ 步骤说明的浓缩，供人读）。
# 版本轴：只有这一个（与 adapters/wiring-scope.yaml 同形）。形状变了就递增它，
# 加载器只接受它认识的版本号，读到别的版本一律报错（未知一律拒绝，不静默忽略）。
# "2"（台阶 5）只多了一个**可选**字段 covers_facts：旧表仍然合法，所以加载器
# **同时接受 "1" 与 "2"**——加可选字段不制造兼容窗口，与 wiring-scope 的声明文件同型；
# 本表写成 "2"。按 AGENTS 第 55 条，这次递增与上面几段注释、加载器常量、
# 写死版本号的用例、AGENTS 第 55 条那张表的登记在**同一个提交**里。
