# Phase 5 验证器注册表：谁能产生证据、在哪个阶段、用哪个工具、缺工具时怎么算。
#
# 这是数据不是代码：新增语言 = 加一个 rule pack + 一个 Adapter；新增规则 = 在 policies/ 里
# 写一条规则（它的 checker 必须已经有验证器声明，否则注册表加载就会失败）。
#
# 失败语义：validators[].critical=true 的验证器只要没跑成（缺失 / 版本不符 / 超时 / 崩溃 /
# 配置错误 / 输出非法），需要它的规则就以 critical 违规阻断——同一批里的其他 PASS 抵消不了它。
#
# 数据版本约定（本文件自己的）：**形状变了就同时递增 version 与 schema_id**。
# 加载器是严格模型（未知字段一律报错），因此"新增一个顶层段"对旧读取方就是破坏性变更：
# 旧读取方会拒绝新文件，而不是忽略新段——版本标识必须跟着动，否则"读的是哪一版形状"只能靠猜。
# version 2 / validator-registry/2：新增 uncovered_languages（P2）。
version: 2
schema_id: validator-registry/2

defaults:
  timeout_ms: 10000
  max_output_bytes: 262144
  max_source_bytes: 1048576
  max_message_chars: 500
  max_evidence: 200
  max_parallel: 2
  probe_timeout_ms: 5000

# 阶段顺序：Code → Source → AST → Dependency → Docstring → Lint → Type → Tests → Evidence → Policy
stages:
  - source
  - ast
  - dependency
  - docstring
  - lint
  - type
  - tests

rule_packs:
  - id: python-core
    language: python
    description: 标准库即可完成的确定性证据（源码哈希、语法、import/调用、依赖图、docstring）
    validators: [py.source, py.ast, py.depgraph, py.docstring]
  - id: python-tools
    language: python
    description: 外部工具证据（Ruff / 类型检查器 / pytest）；工具不在就叫 unavailable，不降级
    validators: [tool.ruff, tool.mypy, tool.pytest]

# 「按设计不取证」的语言（07 号报告 P2）：只有 python 有 rule pack 时，任何非 python 目标在
# 取证路径上只能得到 RegistryError（→ evidence_unavailable → 退出码 2）——连"本次没有任何规则
# 需要验证器证据"的文档写入也被一并拦下。失败关闭本身没错（AGENTS 第 20/42 条），缺的是
# **表达"哪些语言按设计不取证"的地方**；这里就是那个地方，它是数据，理由可以被评审。
#
# 口径（写在这里，读账本的人不必去猜代码）：
#   - 命中这里的语言产出一条**显式判定**，不是错误、也不是静默放行：
#     PipelineReport.language_coverage.status = not_covered_by_design（理由取本项 reason）；
#   - **声明不等于放行**：本次若有规则需要某个 checker 的证据，仍然按失败关闭阻断；
#   - 既没有 rule pack、也不在这里的语言，保持 RegistryError（退出码 2），不被顺带放行；
#   - 同一个 language 既有 rule pack 又出现在这里 = 自相矛盾，加载期直接报错；
#   - 每项的 reason 不能为空：空理由等于把"平台为什么不查这门语言"重新变成不可读。
uncovered_languages:
  # 单行标量（不用折叠块）：reason 会逐字进 PipelineReport.language_coverage 与审计摘要，
  # 折叠换行会把中文句子拼出一个多余的空格。
  - language: text
    reason: 平台没有 text / markdown 的 rule pack，按声明不取证：这类目标（.md 等文档）的判定只由上下文类 checker 决定，需要验证器证据的规则一律失败关闭

validators:
  - id: py.source
    version: "1.0"
    kind: builtin
    stage: source
    facts: [source]
    critical: true
    description: 读取目标文件并计算内容哈希；读不到 / 超大 / 非 UTF-8 都是失败关闭

  - id: py.ast
    version: "1.0"
    kind: builtin
    stage: ast
    facts: [syntax, imports, calls]
    critical: true
    requires: [py.source]
    description: 标准库 ast 解析：import、from-import（别名 / 相对导入）、动态 import、调用链与语法错误

  - id: py.depgraph
    version: "1.0"
    kind: builtin
    stage: dependency
    checkers: [forbidden_dependency]
    facts: [dependencies]
    critical: true
    requires: [py.source, py.ast]
    description: 依赖图：解析到项目内文件 / 标准库 / 外部包；无法解析的内部依赖与动态 import 失败关闭

  - id: py.docstring
    version: "1.0"
    kind: builtin
    stage: docstring
    checkers: [missing_docstring]
    critical: true
    requires: [py.source, py.ast]
    description: PEP 257：按规则声明的对象（模块 / 类 / 函数 / 方法）检查 docstring 缺失

  - id: tool.ruff
    version: "1.0"
    kind: external
    stage: lint
    checkers: [style_lint]
    critical: true
    requires: [py.source]
    timeout_ms: 30000
    description: Ruff（外部 Linter）；诊断码归属哪个规则由规则数据决定，分析不成立的码由 analysis_failure_codes 声明
    tool:
      command: [ruff]
      version_args: [--version]
      version_pattern: 'ruff ([0-9][0-9A-Za-z.\-+]*)'
      version_requirement: ">=0.6,<1"
      argv: ["check", "--output-format=json", "--no-cache", "--config", "{config}", "{paths}"]
      config: validation/ruff.toml
      # "本次分析不成立"码：命中即失败关闭（不是 OK、也不是 FINDINGS），并且**不得**把本验证器
      # 声明的 checker 记进 served —— 否则"没查成的"会被记成"查过了"（N17：语法错误文件上
      # 39 条 style_lint 曾是空判定）。它与 unmapped_findings 是两件事：后者是"跑成了、
      # 但诊断没有规则归属"，仍然只计数、不判定。
      # 口径：**按码声明**，不按"没有规则归属"判定——后者会把 F811 / F841 / W291 这类
      # "跑成了、只是没有归属"的诊断一起升级成失败关闭，违反 AGENTS 第 22 条（只计数、不判定）。
      # "本次分析不成立"是工具诊断词汇里的性质，只有数据能表达它；名单还必须与规则归属、
      # select 表互不相交（tests/contract/test_validator_protocol.py 双向钉住）。
      # invalid-syntax 是 ruff 对"无法解析这个文件"的诊断码（本仓库实测 0.14.13）：它不在
      # validation/ruff.toml 的 select 里，也不对应任何项目规则，只会掉进 unmapped_findings，
      # 因此"靠 select 表管住它"做不到。
      analysis_failure_codes: ["invalid-syntax"]

  - id: tool.mypy
    version: "1.0"
    kind: external
    stage: type
    checkers: [type_check]
    critical: true
    requires: [py.source]
    timeout_ms: 60000
    description: mypy（类型检查端口）；仓库当前没有启用类型检查规则，端口与失败语义已就位
    tool:
      command: [mypy]
      version_args: [--version]
      version_pattern: 'mypy ([0-9][0-9A-Za-z.\-+]*)'
      version_requirement: ">=1.8,<2"
      argv:
        ["--no-incremental", "--no-error-summary", "--show-column-numbers",
         "--no-color-output", "--config-file", "{config}", "{paths}"]
      config: validation/mypy.ini

  - id: tool.pytest
    version: "1.0"
    kind: external
    stage: tests
    checkers: [missing_tests, failing_tests]
    critical: true
    requires: [py.source]
    timeout_ms: 120000
    description: 按变更集选择最小相关测试并运行；隔离缓存、限时限量，失败用例逐条产出证据
    tool:
      command: ["{python}", "-m", "pytest"]
      version_args: ["--version"]
      version_pattern: 'pytest ([0-9][0-9A-Za-z.\-+]*)'
      version_requirement: ">=8"
      # --confcutdir {workspace}：-c 指向 validation/ 时 pytest 会把 confcutdir 定在 validation/，
      # 被测工作区之上的每一层目录都成了收集起点、其中的 conftest 会被加载——结论随"工作区放在哪"
      # 变化，违背 validation/pytest.ini 的约定。把收集范围钉在工作区内（回归用例：
      # tests/integration/test_validator_pipeline.py::test_conftest_above_the_workspace_is_not_part_of_the_run）。
      argv:
        ["-c", "{config}", "-q", "-rf", "-p", "no:cacheprovider", "--no-header",
         "-o", "addopts=", "--rootdir", "{workspace}", "--confcutdir", "{workspace}",
         "{nodeids}"]
      config: validation/pytest.ini
