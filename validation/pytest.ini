# 测试验证器（tool.pytest）的固定配置。
#
# 为什么必须显式指定：pytest 会向上寻找 ini 文件，把**宿主仓库**或**被验证项目**的
# pytest 配置继承进来（addopts、norecursedirs、markers 都会变）。验证器用 -c 指向这份
# 文件，**ini 那一侧**的收集范围因此只由它自己（addopts 显式留空）与命令行参数决定。
#
# 这句话管不到**环境变量**（复核发现）：pytest 在 _preparse 阶段把 PYTEST_ADDOPTS 直接插进
# argv，任何 ini 值——包括这里的 `addopts =`——都拦不住它，宿主/harness 可以用它注入
# -k / --ignore / --strict-markers 之类的东西。也就是说这份文件能保证的是"不再继承别的
# ini"，不是"收集范围只由本文件与命令行决定"。
# 验证器路径上这道口子已经由适配器堵住：子进程环境走 ENV_ALLOWLIST 白名单
# （src/validators/adapters/base.py），里面**没有** PYTEST_ADDOPTS。手动跑 pytest 时若需要
# 同等保证，得自己确认这个变量为空。
[pytest]
addopts =
