[pytest]
# 本文件是 pytest 配置的**唯一**来源：pytest 的 ini 优先级是 pytest.ini > pyproject.toml，
# 只要本文件存在，pyproject.toml 的 [tool.pytest.ini_options] 就整体失效（已删除，避免"改一处忘一处"，
# 也避免那份里的 minversion 静默消失）。新增选项写这里。
minversion = 8.0
# 缓存目录固定放在 .tmp/ 下：仓库根目录只保留源码、规则与文档。
cache_dir = .tmp/.pytest_cache
testpaths = tests
addopts = -ra --strict-markers --strict-config
markers =
    contract: 核心协议契约测试
    integration: 真实 CLI 与文件系统边界的集成测试
    security: 对抗测试（注入、越权、缓存失效、失败关闭）
