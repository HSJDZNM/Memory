# Phase 5 语言专项规则包：PEP 8「Programming Recommendations」——与 True / False 比较。
#
# 出处：docs/mirrors/python-pep-code-style/pep-8-python-code/index.md（L1039）§"Programming Recommendations"：
#   "Don’t compare boolean values to True or False using `==`:"（紧随其后标为 Worse 的是
#    "if greeting is True:"）。
id: STYLE-007
version: 1
name: no-boolean-equality-comparison
description: 不得用 == / != 与 True / False 比较布尔值，直接写 if cond 即可。
scope:
  language: python
severity: error
enforcement:
  type: deterministic
  checker: style_lint
rule:
  style_lint:
    tool: ruff
    codes: [E712]
message: 不要把布尔值与 True / False 用 == / != 比较，直接判断该布尔值本身（Ruff E712；PEP 8「Programming Recommendations」）。
source:
  kind: standard
  path: docs/mirrors/python-pep-code-style/pep-8-python-code/index.md
  note: >
    E712 默认只覆盖 == / !=（实测 ruff 0.14.13：`greeting == True` 与 `flag != False` 都报）。
    PEP 8 同节还写了更糟的 `if greeting is True:`，**当前版本没有任何码位覆盖它**——
    实测 `--preview --select ALL` 下该形态零诊断；note 此前写的"没有启用对应码位（E712 的 strict
    检查属于 preview）"也不可审计：`lint.pycodestyle.strict` 这个选项在 0.14.13 已不存在
    （`--config lint.pycodestyle.strict=true` 直接报 unknown field，该节只剩 max-line-length /
    max-doc-length / ignore-overlong-task-comments）。所以那个形态不是"没启用"，而是"没有码位"，
    本规则不声称覆盖它。
