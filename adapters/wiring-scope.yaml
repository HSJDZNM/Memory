# 边界裁定：平台治理什么、不治理什么（控制面重构方案 §3.5 的最小形态）。
#
# 纪律：每一条「不治理」都必须带 owner / reason / consequence / expires_at ——
# 否则「不在范围内」就是一张永不过期的空白支票。报告（三数与五个差集）与工具化的
# in_scope_not_wired 检查属于台阶 4/5，不在这里。
#
# 校验入口：python -m provenance.cli wiring-scope --check
#
# schema "2"（2026-10-01 裁定①，24 号 §8.3）：加载器**同时接受 "1" 和 "2"**，新增字段一律可选，
# 且不新增任何加载期 FATAL。本版新增的四个字段（本条声明文件今天只用了第一个）：
#   channel_kinds  发现侧 kind → 声明侧 kind 的映射（**数据**，不是代码里的分支）
#   covers         条目级显式覆盖（glob 作用于 channel_id；显式优先于 kind 档）
#   governs_tree   条目级：这条声明覆盖的通道是不是**有意**治理另一棵树（写了才是 self /
#                  other；**没写 = unknown**，读取侧不替它认领 self —— 2026-10-01 裁定④，
#                  24 号 §8.4 / 23 号 §15.1）
#   tree_ref       governs_tree=other 时的指针（仓库相对路径或 <outside-workspace>；只放指针）
#
# **2026-10-01 第 25 轮（裁定⑤）**：covers 全部写上——12 条被发现的通道，每一条都有一条
# **显式**声明覆盖它（逐条清单与理由见 24 号 §8.4，读数见 23 号 §16.2）。这样
# 「同档多条声明判决不同 → 谁都定夺不了」不再发生，第 0.5 条的改判也**看得见**了。
# `governs_tree` 只写在 governed-session-hook 上（证据说它治理另一棵树 → other）；
# 其余声明**不写**，读取侧因此是 unknown（裁定④），不替它们认领 self。
#
# **2026-10-01 第 26 轮（裁定①，写进 23 号 §16 / 24 号 §8 / 25 号 §8）**：评审方更正——
# verify-bc / verify-gov / verify-manual 是接在同一条受控桥上的会话，不是"验证轮留下的测试残留"，
# 三条并入 governed-session-hook 的 covers（in_scope，governs_tree 已写 other，tree_ref 已覆盖
# 它们的受控项目）；dsh-verify-profiles 因此只保留 verify-exit2。**decision 一个都没改**：
# governed-session-hook 仍是 in_scope、dsh-verify-profiles 仍是 out_of_scope。
schema_version: "2"

# 发现侧 kind → 声明侧 kind：`adapters.cli wiring` 今天发现的通道全是 dsh-profile，
# 它们对应"Agent 运行时"这一档声明。没有映射的发现 kind → governs.decision = undeclared（不猜）。
channel_kinds:
  dsh-profile: agent_runtime

scope:
  - id: governed-session-hook
    decision: in_scope
    kind: agent_runtime
    owner: platform
    # 受控会话的七条通道（24 号 §8.4 第 1 条的四条 + 2026-10-01 裁定① 并入的三条）：
    # 显式覆盖优先于 kind 档。
    covers: ["dsh:governed", "dsh:governed-*", "dsh:verify-bc", "dsh:verify-gov", "dsh:verify-manual"]
    # 证据（hooks_config / audit_path / bridge.entry 渲染成 <external>/…）说它治理的是
    # **另一棵树**：声明侧现在承认这件事；tree_ref 只放指针，不放正文、不放绝对路径。
    governs_tree: other
    tree_ref: .tmp/governance-capability-*
    reason: >-
      受控会话（hooks 配置指向 adapters.dsh.hooks）由本仓库治理：判定、阻断、审计与
      受控执行都是平台代码，接线失效必须失败关闭。2026-10-01 评审更正：verify-gov /
      verify-manual / verify-bc 也接在同一条受控桥上（前两条留痕新鲜），并入本条声明的
      covers——"受控会话"这一档不从"测试残留"里读。
    consequence: >-
      接不上就不放行（Hook 退出码 2 = 阻断）；接线事实与留痕事实分别可读，见
      python -m adapters.cli wiring。

  - id: desktop-entry-points
    decision: out_of_scope
    kind: agent_runtime
    owner: host
    covers: ["dsh:desktop"]
    reason: >-
      桌面 GUI 的 profile 装不装策略桥是主机配置，不是本仓库能负责的东西；让仓库门禁
      去拦用户的桌面应用配置，只会把「正确的事做不了」变成「把门禁关掉」
      （.github/workflows/phase-8.yml:266-272 已记过这条决定）。
    consequence: >-
      这些通道的接线事实只以报告形式给出（adapters.cli wiring 总是退出 0），
      仓库不为它们签发任何 allow / block，也不把它们的缺席算成通过。
    expires_at: "2026-12-31"
    renewals: []

  - id: ci-agent-runtime
    decision: expected_absent
    kind: agent_runtime
    owner: ci
    reason: >-
      CI 机器上按设计没有 Agent 运行时：这是**声明**出来的缺席，不是靠跳过反推出来的。
    consequence: >-
      相关步骤显式报 skipped 并写明 reason（跳过的三种终态见 src/adapters/wiring.py），
      不许把「跑不了」记成「通过」。
    expires_at: "2026-12-31"
    renewals: []

  # ------------------------------------------------------------------ 台阶 4 · 写声明
  #
  # 2026-09-30 裁定 R16-4：本轮台阶 4 只做"写声明"5 条 + 到期检查（只报告），
  # **不建任何机制**（governs 轴 / 声明差集 / 豁免到期机制 / 仪器自证一条都没建）。
  # 下面这些就是那 5 条里落在本文件的四组（另外几组落在 tools/README.md 的退出码表、
  # 方案 §4 台阶 4 的会话窗口与写权租约、以及 ci_local 的 REPORT_ONLY_STEPS）。
  #
  # **不接任何线**：这里只做"定性 + 到期日"，没有改任何 profile / hooks.json / adapter 配置。

  # 三条**未声明的通道**（17 号报告 §2.2 清单乙点名：dsh:web / dsh:headless / dsh:verify-dead）。
  # 它们今天的"红"来自"没人声明过它们算什么"，不是"该接没接"——按方案 §3.6 的判据，
  # 处置是**写声明**而不是建机制。
  - id: dsh-web-channel
    decision: out_of_scope
    kind: agent_runtime
    owner: host
    covers: ["dsh:web"]
    reason: >-
      使用者暂不建设前端页面；Web GUI 通道与 desktop-entry-points 同口径，不治理；建设前端时改判
    consequence: >-
      只报告：它的接线事实出现在 python -m adapters.cli wiring 的清点里，仓库不为它
      签发任何 allow / block，也不把"没接"读成"通过"。
    expires_at: "2026-12-31"
    renewals:
      - at: "2026-10-01"
        note: >-
          使用者授权评审方定夺，理由见 24 号 §8。

  - id: dsh-headless-channel
    decision: out_of_scope
    kind: agent_runtime
    owner: host
    covers: ["dsh:headless"]
    reason: >-
      用户侧 headless 基础 profile 属于使用者日常入口，按 agent-channel-inventory-report-mode 的裁定不治理；平台自己的 headless 调用（dsh_sandbox_loop）每次都用 --patch 挂策略 Hook，已在受控范围内
    consequence: >-
      只报告：接线事实出自 python -m adapters.cli wiring 的清点，仓库不为它签发
      allow / block；到期日到了必须续期或改判。
    expires_at: "2026-12-31"
    renewals:
      - at: "2026-10-01"
        note: >-
          使用者授权评审方定夺，理由见 24 号 §8。

  - id: dsh-verify-dead-channel
    decision: out_of_scope
    kind: agent_runtime
    owner: host
    covers: ["dsh:verify-dead"]
    reason: >-
      早先治理能力验证轮（verify-* 一组）留下的测试 profile，不是真实入口；仓库内没有任何引用；如果使用者删除该 profile，须同批删除本声明
    consequence: >-
      只报告：清点会照实报它 not_wired，但仓库不据此拦任何东西，也不把这条读数
      当成"平台少查了一步"；到期日到了必须续期或改判。
    expires_at: "2026-12-31"
    renewals:
      - at: "2026-10-01"
        note: >-
          使用者授权评审方定夺，理由见 24 号 §8。

  # 与 dsh-verify-dead-channel **同组**的那条测试 profile（2026-10-01 裁定，24 号 §8.4 第 4 条；
  # 同日裁定① 把另外三条并入 governed-session-hook，本声明因此只剩 verify-exit2）。
  # 新增声明**不是接线**：只把「没人声明过」变成「声明过、且带到期日」（方案 §3.6 的收缩承诺面）。
  - id: dsh-verify-profiles
    decision: out_of_scope
    kind: agent_runtime
    owner: host
    covers: ["dsh:verify-exit2"]
    reason: >-
      缺 hooks 配置、不活跃的验证轮测试 profile；使用者删除 profile 时须同批删除本声明
    consequence: >-
      只报告：清点会照实报它的接线事实（verify-exit2 是 hooks_config_missing），
      仓库不为它签发任何 allow / block，也不把这条读数当成「平台少查了一步」；
      到期日到了必须续期或改判。
    expires_at: "2026-12-31"
    renewals: []

  # 只写在 CI 注释里的那条边界裁定（.github/workflows/phase-8.yml:266-272）收进数据。
  # 它说的不是"某条通道接没接"（那由 governed-session-hook 与 desktop-entry-points 承接），
  # 而是**本仓库的门禁对使用者日常入口的检查形态**：清点步骤只报告，可失败形态是 --check。
  - id: agent-channel-inventory-report-mode
    decision: out_of_scope
    kind: gate_check
    owner: platform
    reason: >-
      平台治理受控会话、不治理使用者的日常入口：某个 GUI / CLI profile 装没装策略桥是主机配置，
      不是本仓库能负责的东西；让仓库门禁去拦用户的日常配置，只会把"正确的事做不了"变成
      "把门禁关掉"（这条决定此前只写在 CI 注释里，见 .github/workflows/phase-8.yml:266-272）。
    consequence: >-
      Agent 通道清点（python -m adapters.cli wiring）在这些通道上只报告、总是退出 0；
      可失败形态是 python -m adapters.cli wiring --check（需要时再加 --require-runtime），
      由 tests/contract/test_wiring_inventory.py 与 tools/governance_gap_probe.py 钉住。
      仓库不为它们的接线缺席签发 allow，也不把缺席读成通过。
    expires_at: "2026-12-31"
    renewals: []
