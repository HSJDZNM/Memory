# Legacy Agent（只有 PostToolUse）：默认工作区与 dsh 相同（仓库根）。
#
# 它不接入受控执行链路，也不需要：平台在接入阶段就把它的上限算成 read_only，
# 受治理动作会被能力门禁拒绝，而不是"跳过治理"。

schema_version: "1.0"
project_root: ../..
rules:
  - ../../policies
project: memory
timeout_ms: 5000

layers:
  - pattern: "**/*_controller.py"
    layer: controller
  - pattern: "**/*_service.py"
    layer: service
  - pattern: "**/*_repository.py"
    layer: repository
  - pattern: "**/*.py"
    layer: module

languages:
  - pattern: "**/*.py"
    language: python

# 主体是**显式声明**的授权输入：事件里自称的主体只用于核对，不一致即拒绝。
principal:
  subject: local-user
  roles: [developer]

ledger_alias: legacy-post-only
max_events_per_window: 50
window_seconds: 60
audit_log: ../../.tmp/artifacts/phase-6-legacy-audit.jsonl
