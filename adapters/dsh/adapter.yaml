# dsh Adapter 的运行期配置（Phase 2 的 examples/dsh/dsh-adapter.yaml 是同一套字段）。
#
# 这里声明的是**显式上下文来源**：dsh 的钩子载荷只提供 file / operation / agent，
# layer、language、project、principal 全部由这份配置声明；声明不出来就失败关闭。

schema_version: "1.0"
project_root: ../..
rules:
  - ../../policies
project: memory
timeout_ms: 5000

layers:
  # P4/P5：平台级「哪些路径算测试」只有一份声明——validation/test-layout.yaml 的
  # test_patterns。这里必须逐条对应，并且放在生产层 glob **之前**：layers 是
  # first-match-wins，tests/unit/test_order_repository.py 会先命中 **/*_repository.py
  # 被判成 repository，而 policy.check 对同一个文件按平台声明给出 layer=test ——
  # 同一个文件在两个层上被判，正是 P4/M1 要消灭的分叉（Hook 路径 allow、验证器路径
  # block，两边读的人都不知道对方看到了什么）。
  # 漂移由 tests/contract/test_agent_adapters.py 的对照用例钉住：平台每条 test_patterns
  # 的见证路径都必须落到 test 层。
  - pattern: "tests/**/test_*.py"
    layer: test
  - pattern: "tests/**/*_test.py"
    layer: test
  - pattern: "**/*_controller.py"
    layer: controller
  - pattern: "**/*_service.py"
    layer: service
  - pattern: "**/*_repository.py"
    layer: repository
  - pattern: "**/*.py"
    layer: module
  - pattern: "**/*.md"
    layer: docs
default_layer: null   # 显式写明"不提供默认值"：未声明的路径会被阻断并要求补声明

languages:
  - pattern: "**/*.py"
    language: python
default_language: text

principal:
  subject: local-user
  roles: [developer]

# 台账命名空间：同一个 dsh 二进制跑多份部署时改这里；默认等于 agent_id。
ledger_alias: dsh
max_events_per_window: 50
window_seconds: 60

audit_log: ../../.tmp/artifacts/phase-6-dsh-audit.jsonl
registry: ../../registry/tool-registry.yaml
registry_approved: ../../registry/tool-registry.approved.json
