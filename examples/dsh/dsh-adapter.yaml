# dsh Adapter 的显式上下文来源（示例：把它复制到受治理项目的 .policy/ 下）。
#
# 设计原则：核心协议需要的字段里，dsh 的 Hook 载荷只提供 file/operation/agent；
# layer、language、project、principal、trace_id 全部在这里显式声明，
# 没有声明项时 Adapter 失败关闭，绝不从文件名或目录猜测。
#
# 路径基准（最容易读错的一条）：本文件里的相对路径**不是**相对 project_root，而是相对
# **本配置文件自己所在的目录**（load_config → config_from_mapping(base_dir=config_path.parent)，
# 每个路径都过 _as_path(..., base_dir=...)，见 src/adapters/dsh/adapter.py）。
# 所以下面的 ../.. 只在"本文件位于 examples/dsh/"（仓库根往下两级）时成立。
# 把它复制到 <project>/.policy/ 之后，锚点跟着挪到 <project>/.policy/，这些值必须一起改：
#
#   project_root: ..                                   # = <project>
#   rules: [../policies]                               # = <project>/policies
#   audit_log: ../.tmp/artifacts/dsh-audit.jsonl
#   registry: ../registry/tool-registry.yaml
#   registry_approved: ../registry/tool-registry.approved.json
#   enforcement_ledger: ../.tmp/artifacts/dsh-enforcement-ledger.jsonl
#   pre_evidence.registry_root: ..                     # 只有启用取证时才需要
#
# 不改的后果不是"报错就算了"：项目里的 ../.. 指向受治理项目的**父目录**，project_root
# （包含边界）会挪到项目之外——规则 / 注册表 / 台账多半不存在（失败关闭），
# 恰好存在时则是**静默**加载了项目外的数据。

agent_version: "0.2.1-alpha.2" # 记录用；与 adapters/dsh/manifest.yaml 的声明必须相等（tests/contract/test_dsh_layer_declaration.py 钉住）；必须与宿主实际版本一致（python -m adapters.cli host-version --check 会比对）；升级 dsh 后先重跑 fixture 与沙箱闭环再改这里
project: memory
project_root: ../.. # 相对**本文件所在目录**（见文件头）；越出这个根目录的写入一律拒绝
rules:
  - ../../policies # 至少一个规则目录；任一文件损坏则整体不加载（同样相对本文件所在目录）

timeout_ms: 5000 # 内部预算：必须严格小于 hooks.json 里的 timeout

# M1：测试路径必须**第一个**声明。
#
# 分层是数据，改一行就换结论——但**顺序**能让一条生产层规则罩住测试文件：
# tests/test_shipment_controller.py 会命中下面的 **/*_controller.py，被当成入口层，
# 于是生产层的规则开始管测试的写法（实测把一份测试从"真实装配对象图"挤成了"手写替身"）。
# 声明 test_paths / test_layer 之后，加载期会证明每条测试路径都落在 test_layer，
# 证明不了就拒绝启动（src/adapters/dsh/adapter.py 的 layer_test_conflicts）。
test_paths:
  - "tests/**/*.py"
test_layer: test

# path → layer：按顺序取第一个命中；不命中则失败关闭（除非显式声明 default_layer）
layers:
  - pattern: "tests/**/*.py"
    layer: test
  - pattern: "**/*_controller.py"
    layer: controller
  - pattern: "**/*_service.py"
    layer: service
  - pattern: "**/*_repository.py"
    layer: repository
  - pattern: "**/*.py"
    layer: module
  - pattern: "**/*.md"
    layer: docs
default_layer: null # 显式写明"不提供默认值"：未声明的路径会被阻断并要求补声明

languages:
  - pattern: "**/*.py"
    language: python
default_language: text # 非 Python 文件的语言显式声明为 text，而不是猜成 python

audit_log: ../../.tmp/artifacts/dsh-audit.jsonl

# —— Phase 4：受控执行的授权链路 ——
# 受治理工具必须由 Tool Registry 描述（风险级别 / 参数白名单 / 权限 / 事后验证器），
# 并且必须能追到主体；缺任何一项，Hook 都会失败关闭（受控工具不执行）。
principal:
  subject: local-user
  roles:
    - developer
registry: ../../registry/tool-registry.yaml
registry_approved: ../../registry/tool-registry.approved.json
enforcement_ledger: ../../.tmp/artifacts/dsh-enforcement-ledger.jsonl
# 高风险动作（pwsh / bash / run_code）需要事先签发、且与具体 action_hash 绑定的审批文件。
# 生成方式见 README：python -m enforcement.cli approve --request <req.json> --out <approval.json>
# 路径同样相对**本文件所在目录**（见文件头）：本文件在 <project>/.policy/ 下时，写 approval.json 即可；
# 写成 .policy/approval.json 会解析成 <project>/.policy/.policy/approval.json —— 那个文件不存在，
# 于是每个高风险动作都以"审批缺失"失败关闭（看起来像没审批，实际是路径写错）。
# approval_file: approval.json

# —— G3：动手前取证（可选；默认关闭 = 保持 Phase 2 契约） ——
# 声明并启用后，pre-execute 会在**影子工作区**（副本，用完即删）上应用"提议的新内容"，
# 跑 Phase 5 的真实验证器，把 EvidenceBundle 交给引擎——证据类 checker（style_lint /
# missing_docstring / missing_tests / failing_tests）于是从 skipped_rules 变成参与判定。
# 代价：每次写类动作都要在副本上跑一遍验证器；失败/超时/提议内容重建不了一律失败关闭
# （evidence_unavailable，退出码 2），绝不回落到"没证据就当跳过"。
#
# 预算不等式（check_wiring 会查）：pre_evidence.timeout_ms + timeout_ms < hooks.json 的 timeout。
# 上面的 hooks.json 写的是 30s、本文件的 timeout_ms 是 5000，因此取证预算最多 24999ms；
# 下面给 20000（和 = 25000 < 30000，直接取消注释就能启用）。
# **不要**把它调成 60000：65000 > 30000 会让接线自检报不等式不满足，而 dsh 侧 30s 就把 Hook 杀掉——
# 被杀等于放行，正是这条不等式要防的路径。要更长的取证预算，必须同一次改动里把 hooks.json 的
# timeout 一起调大。
#
# pre_evidence:
#   enabled: true
#   registry_root: ../..            # 平台验证器数据所在处：包含 validation/ 的那一层（也可直接写 validation/ 目录）
#   workspace: .                    # 要取证的受控工作区（默认 project_root）
#   shadow_root: .policy/pre-evidence   # 影子副本落点（用完必删；与被治理项目重叠会被拒绝）
#   exclude: [".git/**", ".policy/**", ".tmp/**", "**/__pycache__/**"]
#   validators: []                  # 省略 = 按规则选择；写死可省时间（例如 [py.source, tool.ruff]）
#   timeout_ms: 20000
