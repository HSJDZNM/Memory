# Phase 3 摄取清单（knowledge/corpus.yaml）
#
# 这是"找到什么值得告诉 Agent"的**数据**，不是代码：新增/移除语料只改这里。
# 每个数据集对应仓库里的一个离线镜像目录，条目必须能在该镜像的 manifest.json 中找到，
# 并由 tools/retrieval_eval.py + tests/integration/test_retrieval_index.py 校验：
#   - 文件存在，且本地内容哈希等于镜像 manifest 记录的 sha256（漂移会被记录并报出，不静默）；
#   - 许可（license）与来源（source_url）必填，缺失即加载失败；
#   - dataset / tier / visibility 三件事分开：tier 决定 Context 中的优先级，
#     visibility 决定谁能检索（restricted 的数据集必须由调用方显式授予）。
#
# 维护方式（改动语料后必须重跑）：
#   python -m retrieval.cli verify      # 清单与镜像 manifest、许可、哈希是否一致
#   python -m retrieval.cli index       # 幂等重建索引
#   python tools/retrieval_eval.py      # 固定评测集基线是否仍达标

version: 1

# 检索策略：预算与阈值在这里声明，测试与 CLI 都读它，代码里不留"脱离数据的常数"。
policy:
  top_k: 5                  # 每次检索返回的最大片段数
  max_query_chars: 200      # 自由文本规范化后的字符上限（超出即截断并记录）
  max_query_terms: 24       # FTS 词项上限，防止超长查询放大
  max_chunk_chars: 1200     # 单个 chunk 的目标预算（分块器按它打包）
  hard_max_chunk_chars: 8000  # 原子单元（超长代码块/单行）的硬上限，超过即截断并记录
  context_budget_chars: 4000   # Engineering Context 的总字符预算（严格上限）
  max_snippet_chars: 1000      # Context 中单个片段的字符上限
  max_snippets: 8              # Context 中参考片段数量上限
  expansion: knowledge/query_expansion.yaml  # 受控中英术语表（数据，不是代码）

# 数据集：name 是权限与过滤的稳定标识，不要重命名（重命名等于换数据集）。
datasets:
  - name: google-eng-practices
    title: Google Engineering Practices
    mirror: docs/google-eng-practices
    license: CC BY 3.0
    license_source: docs/google-eng-practices/LICENSE.txt
    tier: guidance
    visibility: public
    entries:
      - review/reviewer/looking-for.md
      - review/developer/small-cls.md

