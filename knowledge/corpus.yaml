# 受限数据集示例位：默认留空。授权来自调用方显式声明的 AccessScope，
# 绝不从查询文本、文件路径或数据集名推断。新增受限数据集时在此登记并补访问测试。
restricted_datasets: []

# 已知恶意 chunk 的隔离清单：条目 (chunk_id, text_hash, reason)。
# text_hash 必须与当前 chunk 文本一致才生效；源文变更后隔离自动失效（旧记录清理并记录在 run 报告里）。
quarantine: []

# curated guidance → project policy 的溯源（rules(id, version, source_chunk_id)）。
#
# 这里登记的是"这条规则是哪一段镜像原文提炼来的"：`(dataset, source_path, heading_path)` 由索引器
# 解析成稳定的 chunk_id 写入 rule_sources 表（按标题路径**前缀**匹配；解析不到则索引 run 失败，不静默）。
#
# 现状（2026-09）：`policies/**` 里有 39 条规则来自 6 篇 PEP 与 15 篇 OWASP Cheat Sheet 镜像。
# 登记它把"文档 → 规则"这条链路接通：`python -m retrieval.cli rules --rule SEC-008` 能查回出处，
# `--chunk <chunk_id>` 能反向查出"这段原文被哪条规则引用了"。
#
# 维护约定（改了规则或镜像就要同步，否则索引直接失败）：
#   1. 新增/修改由镜像提炼的规则 → 在这里加/改一行；
#   2. 规则引用的文档必须先在对应 dataset 的 entries 里登记（否则它没有被索引）；
#   3. 改完重跑 `python -m retrieval.cli verify` 与 `index`；
#   4. `heading_path` 用文档里真实存在的标题路径（前缀匹配），不要凭印象写。
rule_sources:
  - rule_id: DOC-001
    rule_version: 1
    dataset: python-pep-code-style
    source_path: pep-257-docstrings/index.md
    heading_path: ["Docstring Conventions","Specification","What is a Docstring?"]
