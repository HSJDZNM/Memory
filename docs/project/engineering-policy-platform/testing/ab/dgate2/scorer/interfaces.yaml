# D 门 2 评分器：A3「公开符号最小面」的声明接口上限（`--interfaces` 的输入）。
#
# 为什么冻结包里必须有这一份
# ========================
# structure_metrics 的 A3 有两种口径（`detail.basis` 会把用了哪一种写出来）：
# - declared_caps（给了 --interfaces）：每个模块的公开定义数（DefinitionFact.private=false，
#   **含方法**；§4.2 原文「类+2 方法」）≤ 这里声明的上限；**没声明上限的模块一律判 fail**；
# - module_all（没给 --interfaces）：模块级公开定义必须被 `__all__` 覆盖，没有 `__all__` 就 fail。
#
# 本轮选 declared_caps：任务（examples/dsh/b-plan/a3-task-v3/task-package/first-message.txt）**不要求**
# 模型写 `__all__`，走 module_all 会对所有臂恒红——一条对所有臂都红的谓词区分力是 0，等于把 A3 变成
# 常数项。上限是**上界不是目标值**：合法解只需不超过它；超了就是「公开面比接口清单大」（多出的公开符号）。
#
# 数字怎么来的（上限 = v3 最终树参考实现的公开定义数；三个基线模块各自 1 个余量）
# ==========================================================================
# order_audit   类 OrderAudit + record + entries                    = 3（无余量）
# order_service 类 + create + listing + audit_entries               = 4 → 上限 5
# order_controller 类 + create + listing + audit_entries            = 4 → 上限 5
# order_repository 类 + insert + listing                            = 3 → 上限 4
# tools/audit_demo main                                             = 1（无余量）
# 两个 __init__.py 只有模块 docstring（0 个定义，含模块本身不算定义）  = 0
# 私有定义（名字以 _ 开头，含 __init__ 这类魔法方法）不计入公开面。
# 测试层不约束（A3_SKIP_LAYERS）；conftest.py 属 test 层，因此不在这里。
#
# 改这一份 = 改判据：与 scorer.yaml 同批改，并重新生成 scorer/manifest.sha256。

src/shop/__init__.py: 0
src/shop/order_audit.py: 3
src/shop/order_controller.py: 5
src/shop/order_repository.py: 4
src/shop/order_service.py: 5
tools/__init__.py: 0
tools/audit_demo.py: 1
