# bank-data-migration 的评分器（机读规格）
#
# 判据来源：bank/README.md §4.8 与 §6 决策 1；本文件的结构照 tasks/bank-flagship-returns/scoring.yaml，
# 内容按本题的允许写集合与基线重算。与 dgate2/scorer/scorer.yaml 的关系：只复用 T/C/A=40/30/30 与 C/A 的口径，
# **不复制字节**；dgate2 冻结件一个字节不动。
#
# 形状 = **bank-scoring/2**（2026-10-21 §4.2 收口）：顶层 18 键、frozen_inputs 11 键、dimension_t 13 键；
# 同一版本号下只有一种维度形状——pending 与 frozen 只差取值、不差键集合，顶层 status 是判别符。
# 本题的 T 已冻结（2026-10：hidden/PLAN.md 40 条 + hidden/runner.py 落盘后同批写 total / case_ids /
# reverse_cases / 两个 hidden 摘要 / freeze_note: null）。frozen_by 仍是 pending_lead_signature ——
# 它只表示 **Lead 签字**还没做，不表示判据没冻结。
# C 维度：ARCH-001 结构性不适用（file_set 无 controller 层）→ 见 dimension_c.not_applicable，
# effective_total = 27；不把 skipped_rules 读成通过。
# 轴的历史：v1 = 旗舰题首次建轴的形状；v2 = 形状归一 + N/A 口径（schema_id 与 version 同批从 1 起到 2）。
schema_id: bank-scoring/2
version: "2"
task_id: bank-data-migration
operation_type: "数据迁移（v1 JSONL 台账 -> v2：原子替换、幂等、无损、坏行失败关闭）"
status: frozen
frozen_by: pending_lead_signature
authority: >-
  本题库批次：C 与 A 两维的输入（规则集、结构谓词、file_set、冻结文件、允许写）与基线字节由题库冻结包
  作者子会话按 SPEC 冻结；T 维（40 条隐藏验收 + runner）由**独立的出题/参考解子会话**写成并冻结
  total 与 case_ids（该子会话没有读任何实施 diff；本任务此前也不存在参考解）。
  **Lead 签字仍未做**（frozen_by 保持 pending_lead_signature，不冒充）。
  改本文件任一数值 = 换判据，必须同批重算 frozen_inputs 并重生成 task-package/manifest.sha256。

invariants:
  - 本文件不含时戳、run id、绝对路径、耗时；相同输入两次读取逐字节相同。
  - 判据的数值（权重、分母、阈值、作废条件）只能出现在本文件；脚本不许另写一份常数。
  - 跨题只比同一条轴；不写总分/均值/百分比/显著性（bank/README.md §5）。
  - '**T 没有冻结的 total 与 case_ids 时，T 只能记「跑不成」，不记 0 分、不记任何百分比**。'
  - 形状（bank-scoring/2）：顶层 18 键、frozen_inputs 11 键、dimension_t 13 键；pending 与 frozen
    只差取值、不差键集合——加键或改语义必须递增 version 并同批改六份 scoring.yaml。
  - dimension_t.freeze_note 在 pending 题里**必须非空**（写明落盘后同批写哪些字段）；null 只属于已冻结题。

weights:
  T: 40
  C: 30
  A: 30

shared_contract: >-
  所有题库题共享同一骨架：T = 隐藏验收通过数（记 passed/total）+ 加权分 round(40 × passed / total)；
  C = 8 条规则 × 3 分（24）+ 冻结文件未改 3 分 + 无旁路 3 分；A = 10 条结构谓词 × 3 分。
  本题的具体取值（6 个被测 .py、12 个冻结文件、9 条允许写、T 的 40 条）在下面逐项冻结。

