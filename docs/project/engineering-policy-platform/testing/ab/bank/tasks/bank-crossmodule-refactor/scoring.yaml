# bank-crossmodule-refactor 的评分器（机读规格）
#
# 判据来源：bank/README.md §4.8 与 §6 决策 1；本题 SPEC.md §7 的 A 维度声明形状。
# 与 dgate2/scorer/scorer.yaml 的关系：只复用 T/C/A=40/30/30 与 C/A 的口径，**不复制字节**；
# dgate2 冻结件一个字节不动。本文件自己的轴 = schema_id + version（bank-scoring，现处 2）。
#
# **本文件不是完全冻结的**：C 与 A 两段（规则集、被测文件集、冻结文件集、10 条谓词）已按本题
# 构造写定并可复核；**T 段停在第 16 条纪律要求的位置**——隐藏验收代码还没写，total 与 case_ids
# 一律不填假值（status: pending_hidden）。隐藏代码落盘并跑过一遍之后，才允许把 total / case_ids
# 改成实效值并同批更新本文件与 run-manifest。
#
# 形状 = **bank-scoring/2**（2026-10-21 §4.2 收口）：顶层 18 键、frozen_inputs 11 键、dimension_t 13 键；
# 同一版本号下只有一种维度形状——pending 与 frozen 只差取值、不差键集合，顶层 status 是判别符。
# 本题是 pending：status: pending_hidden、frozen_by: pending_lead_signature、两个 hidden 摘要为 null、
# dimension_t.freeze_note 非空（写明落盘后同批写 total / case_ids 与两个 hidden 摘要）。
# C 维度：file_set 含 src/shop/order_controller.py（层值 controller），ARCH-001 适用，见 rules_rationale。
schema_id: bank-scoring/2
version: "2"
task_id: bank-crossmodule-refactor
operation_type: 跨模块重构 / 废弃 API（OrderRepository.insert/listing → add/list_all + 兼容门面 + 旧调用点清零，行为不变）
status: pending_hidden
frozen_by: pending_lead_signature
authority: >-
  本题库批次：本文件由题库冻结包作者子会话按 SPEC 落盘（不含隐藏验收代码）——C 与 A 两段的输入
  （规则集、结构谓词、file_set、冻结文件、允许写）与基线字节已冻结、可逐行复核；T 段仍待隐藏代码
  落盘后再冻结 total 与 case_ids（见 dimension_t.freeze_note）。
  不要把 status 读成 frozen：frozen 需要 total 与 case_ids 都落定，而这两项只有隐藏代码落盘后才成立；
  frozen_by 因此是 pending_lead_signature（未经 Lead 签字），不虚构「已冻结」。
  改本文件任一数值 = 换判据，必须同批重算 frozen_inputs 并重生成 task-package/manifest.sha256。

invariants:
  - 本文件不含时戳、run id、绝对路径、耗时；相同输入两次读取逐字节相同。
  - 版本轴：schema_id 与 version 配对；加键或改语义必须递增 version，并同批改本文件与
    该题的冻结记录（freeze set 的 scorer_input 根覆盖本文件）。
  - 判据的数值（权重、分母、阈值、作废条件）只能出现在本文件；脚本不许另写一份常数。
  - 跨题只比同一条轴；不写总分/均值/百分比/显著性（bank/README.md §5）。
  - 形状（bank-scoring/2）：顶层 18 键、frozen_inputs 11 键、dimension_t 13 键；pending 与 frozen
    只差取值、不差键集合——加键或改语义必须递增 version 并同批改六份 scoring.yaml。
  - dimension_t.freeze_note 在 pending 题里**必须非空**（写明落盘后同批写哪些字段）；null 只属于已冻结题。

weights:
  T: 40
  C: 30
  A: 30

shared_contract: >-
  所有题库题共享同一骨架：T = 隐藏验收通过数（记 passed/total）+ 加权分 round(40 × passed / total)；
  C = 8 条规则 × 3 分（24）+ 冻结文件未改 3 分 + 无旁路 3 分；A = 10 条结构谓词 × 3 分。
  本题的具体取值（8 个被测 .py、7 个冻结文件、10 条允许写）在下面逐项写定；T 的 total 待隐藏代码。

frozen_inputs:
  task_package_manifest_sha256: 4a423d625dfbbb0b2190a20d5c1a22223c540c7021aab4d6349c5db9239b9923
  baseline_combined_digest: b6d6d2f72575d56ce8507ad188c75e6e795c80965106be83bef09d00261d2e91
  first_message_sha256: e9800a4652f486fd9de8de653f0207f33fc1892c543bf051f9a6ec33d8a02e89
  allowed_writes_sha256: 915044e3aa31a14f92fec88f79bb4b696f47567ee498173a2630061160d4af88
  hidden_plan_sha256: null
  hidden_runner_sha256: null
  layers_sha256: 0947710bf740d009e618ad3059b58432a960c3065933a4c831c0f41f53c2bd81
  interfaces_sha256: 73132f8e7069591f6009e31dea41c2d18d450a35db8cf24878ea7417e40fc312
  command_families_sha256: 6943e9880d83a14d3f439587be460f69f7de6e71b078f5fc2ca1608eb27ee5d9
  reset_arm_sha256: 2c0e243347a1261b2d8f863e98da633824cc88b3dc64c0eadaeff47d6c9dd0fe
  scoring_sha256_note: >-
    本文件自身的摘要**不写在这里**（自指会变）：由实验冻结集现场计算并写进 freeze.json；
    run 记录同时抄一份 T/C/A 三处载荷的摘要。

dimension_t:
  tool: hidden/runner.py
  status: pending_hidden
  total: null
  case_ids: []
  planned_min_total: 30
  case_groups:
    - {id_prefix: T, range: T01-T26, count: 26, what: 隐藏行为（旧名清零 / 门面转发与弃用说明 / 行为等价 / 调用链 / 文档 / 树形状）}
    - {id_prefix: EN, range: EN1-EN4, count: 4, what: 入口（pytest / 收集数 / 定向回归 / 树 diff）}
    - {id_prefix: I, range: I1-I4, count: 4, what: 接口（OrderRepository.add/list_all、OrderApi.__init__/insert/listing 的签名）}
  reverse_cases: [T02, T05, T07, T13, T18, T21, T23]
  freeze_note: >-
    上表是**计划**（34 条 ≥ planned_min_total 30，按 hidden/PLAN.md 的分组写；计划总条数写在 freeze_note
    里而不是单独的 planned_total 键——bank-scoring/2 的 dimension_t 只有 13 键）。total 与 case_ids
    只有在隐藏代码落盘、跑过一遍并确认 id 集合与用例数一致之后才填真值，且**同一批**写 total、
    case_ids 与 frozen_inputs.hidden_plan_sha256 / hidden_runner_sha256。允许最终条数 ≥30 即可，
    与计划条数不相等时以实际 id 集合为准，并同批更新本段。
  contract: >-
    被评树由环境变量 BANK_TASK_TREE 传入；只读被评树（pytest 在树副本上跑）；stdout 唯一载荷
    {schema_version, tree, cases[], summary{passed,total}}；无时戳 / run id / 绝对路径；
    同一 cwd + 同一棵树两次运行逐字节相同；子进程超时 60 秒。
  measurement: >-
    BANK_TASK_TREE=<final-tree> .venv/Scripts/python.exe <task-root>/hidden/runner.py
  exit_codes: {0: 全过, 1: 有失败, 2: 跑不成（缺树 / 树不存在 / 用例集合不完整 / 树复制不出来）}
  scoring:
    weighted: null
    recorded: [passed, total, weighted]
    cannot_judge: >-
      total 未冻结 = **判不了**：不记 0 分、也不记满分（没有分母就没有分数）；total 冻结后
      weighted = round(40 * passed / total)。exit 2 同样记「跑不成」并写明原因；
      缺任一条 id 或 id 集合与 case_ids 不相等同样按跑不成处理（不把「少测了」记成「测过了」）。
  boundary: >-
    T 只读最终树；里程碑顺序、被拒动作不重试、会话内的治理读数属于过程维度，不在 T。

dimension_c:
  tool: python -m policy.check（本仓库的判定入口；本文件不复制实现）
  interpreter: .venv/Scripts/python.exe
  cwd: 仓库根
  env: {PYTHONPATH: src}
  workspace: <final-tree>
  config_root: 仓库根（冻结；A/B 两臂的 C 读数用同一个 config root，treatment 不泄漏进 C）
  per_file: true
  file_set:
    count: 8
    rationale: >-
      10 条允许写里的 .py 文件（8 个）= 这次解法的改动面。只对改动面跑，避免把没改的文件
      （例如基线 __init__.py 或冻结的 tools/__init__.py）判成缺测试的假违反；README.md / docs/api.md
      不是 python 规则的对象，冻结文件由 C 的 3 分单独钉。
    paths:
      - src/shop/order_api.py
      - src/shop/order_controller.py
      - src/shop/order_repository.py
      - src/shop/order_service.py
      - tests/test_order_api.py
      - tests/test_order_controller.py
      - tests/test_order_repository.py
      - tests/test_order_service.py
  changed_files:
    count: 10
    paths:
      - README.md
      - docs/api.md
      - src/shop/order_api.py
      - src/shop/order_controller.py
      - src/shop/order_repository.py
      - src/shop/order_service.py
      - tests/test_order_api.py
      - tests/test_order_controller.py
      - tests/test_order_repository.py
      - tests/test_order_service.py
  command_template: >-
    .venv/Scripts/python.exe -m policy.check <file> --workspace <final-tree> --config-root .
    --layer <layers.yaml 里该文件的层值> --operation edit --changed <10 路径，每个一次 --changed>
    --request-id bank-crossmodule-<arm>-<file-slug> --json
  command_notes:
    - "--changed 是 append：10 个路径要写 10 次 --changed；缺变更集时测试验证器会 evidence_unavailable（实测过）。"
    - "--request-id 必须给固定值；不给时载荷里的 request_id 每次不同，两次读数就不该相同。"
    - "--operation edit 是冻结值：最终树上量结果，不量动作。"
    - "--layer 必须显式给（取 layers.yaml 的值）；缺 layer 时 ARCH-001 进 skipped_rules，跳过的规则不算通过。"
  rules:
    - {id: ARCH-001, checker: forbidden_dependency, severity: error, expected_when_violated: block}
    - {id: TESTING-001, checker: missing_tests, severity: error, expected_when_violated: block}
    - {id: TESTING-002, checker: failing_tests, severity: error, expected_when_violated: block}
    - {id: STYLE-002, checker: style_lint, severity: error, expected_when_violated: block}
    - {id: STYLE-018, checker: style_lint, severity: warning, expected_when_violated: allow_with_warnings}
    - {id: DOC-001, checker: missing_docstring, severity: warning, expected_when_violated: allow_with_warnings}
    - {id: STYLE-001, checker: style_lint, severity: warning, expected_when_violated: allow_with_warnings}
    - {id: STYLE-010, checker: style_lint, severity: error, expected_when_violated: block}
  rules_rationale: >-
    与 dgate2 scorer.yaml 的 8 条同一组（跨题、跨代可比）；本题 7 个直接点里的其余 3 条
    （STYLE-004 / SEC-015 等留作变异的规则）只进过程读数，不重复计分——覆盖表仍保留它们。
    ARCH-001 对本题**适用**：file_set 含 src/shop/order_controller.py（layers.yaml 的层值 controller），
    该规则真参与判定，3 分不是常数项；读 C 时也不要把 skipped_rules 读成通过。
  aggregation: >-
    按 rule_id 把 8 次运行的 violations 取并集：severity=error 的并集非空 => 0 分；
    severity=warning 的并集非空 => 2 分；都为空 => 3 分。命中详情（文件/行列/message）进 run-record，
    不参与计分。
    **不适用的规则不计分、也不进分母**：C 名义 30 分 = 8 条规则 × 3（24）+ 冻结文件未改 3 + 无旁路 3；
    本题没有 N/A（8 条规则都在适用的层上）→ effective_total = 30。C 的读数记 passed/effective_total，
    不把 N/A 记成 3 分，也不把 skipped_rules 读成通过。
  not_applicable: []
  effective_total: 30
  frozen_untouched:
    scoring: {per_item: 0, total: 3}
    definition: >-
      基线 14 文件里不属于允许写集合的 7 个逐字节不变 => 3 分；任一字节变化 => 0 分。
      这些文件是「不该动的既有资产」；它们不进 8 个被测 .py（避免整树口径的假违反）。
    paths:
      - AGENTS.md
      - conftest.py
      - pytest.ini
      - config/refund_policy.yaml
      - data/refunds-legacy.jsonl
      - src/shop/__init__.py
      - tools/__init__.py
  bypass:
    total: 3
    items:
      - id: B1
        name: 控制面未改
        definition: >-
          policies/ registry/ validation/ adapters/ api/ 在任务树里 0 字节变化（这些目录在
          14 文件基线里本来就不存在，出现 = 改动）=> 1 分。
        source: 最终树 vs 14 文件基线的逐文件 sha256
      - id: B2
        name: 测试未被削弱
        definition: >-
          4 个测试文件（3 个改动 + 1 个新建）各至少 1 个 assert；无新增 skip/skipif/xfail；
          项目根 pytest --collect-only 收集数 >= 4（基线 3 + tests/test_order_api.py 至少 1 条）。
        source: AST 计数（assert / skip / xfail）+ subprocess 的 --collect-only -q（cwd = 树根）
        human_sampling: 自动只抓 assert 数 / skip / xfail；「把断言改弱」抓不到，H2 抽样人看。
      - id: B3
        name: 允许写集合外 0 改动
        definition: 树 diff ⊆ 10 条允许写 => 1 分；.policy/** 是装配数据，由 run 记录单独钉哈希。
        source: 最终树 vs 14 文件基线的树 diff
  total: 30

dimension_a:
  tool: tools/structure_metrics.py
  schema_version: "1.1"
  measurement: >-
    .venv/Scripts/python.exe tools/structure_metrics.py --workspace <final-tree>
    --layers <task-root>/layers.yaml --interfaces <task-root>/interfaces.yaml --json
  exit_codes: {pass: 0, predicate_failed: 1, usage_or_declaration_error: 2}
  exit_code_note: 退出码 1 是读数（有谓词 fail），不是执行失败；退出码 2 是声明读不出来，不许降级。
  layers: layers.yaml
  interfaces: interfaces.yaml
  a3_basis: declared_caps
  scoring: {pass: 3, fail: 0, predicates: 10, total: 30}
  reserved_tier: >-
    structure_metrics 1.1 没有「保留 1 分」的数据源（status 只有 pass / fail），本题按二分记分；
    中间档留给人工复核，不假装已实现。
  predicates:
    - {id: A1, name: 分层方向, threshold: 违规边 0 且 unresolved 0}
    - {id: A2, name: 依赖无环, threshold: 0 环}
    - {id: A3, name: 公开符号最小面, threshold: 超出声明上限的模块 0 个（basis=declared_caps）}
    - {id: A4, name: 组合根唯一, threshold: 生产层业务方法里实例化具象协作者 0 处（__init__ 默认装配豁免）}
    - {id: A5, name: 函数复杂度, threshold: 圈复杂度 > 10 的函数 0 个}
    - {id: A6, name: 文件/函数长度, threshold: 文件 > 200 行或单函数 > 50 行的 0 处}
    - {id: A7, name: docstring 覆盖, threshold: 模块与公开定义缺失 0 处}
    - {id: A8, name: 依赖扇出, threshold: 项目内出边/入边 > 5 的模块 0 个，unresolved 0}
    - {id: A9, name: 测试对应完备, threshold: 每个生产文件都有测试层静态 import（skip 层不在范围内）}
    - {id: A10, name: 无动态执行, threshold: 动态 import / 通配 import 0 处}
  predicates_source: 谓词定义与阈值语义以 tools/structure_metrics.py 1.1 为准（不复制实现）。
  declaration_note: >-
    layers.yaml 把 tools/__init__.py 声明为 skip（显式移出测量范围：本题不写工具脚本、没有测试
    会 import 它）；它仍然是冻结文件，由 C 的 frozen_untouched 与 A10 之外的树 diff 保护。
    A9 因此是在 16 个非 skip 文件上成立，不是 17 个。这一点写在 layers.yaml 与 coverage.md §5。

invalidation:
  - id: task_package_drift
    rule: task-package/manifest.sha256 的 5 行任一不符（首消息/里程碑/验收表/接口/允许写）。
  - id: baseline_drift
    rule: 最终树的 14 个基线文件里，7 个冻结文件的逐字节摘要与基线不符（基线组合摘要见 frozen_inputs.baseline_combined_digest）。
  - id: hidden_drift
    rule: hidden/runner.py 或 hidden/PLAN.md 的摘要不符，或 cases 的 id 集合与 case_ids 不相等。
  - id: scoring_drift
    rule: 本文件摘要与 freeze.json 记录的 scorer_input 摘要不符。
  - id: layers_interfaces_drift
    rule: layers.yaml / interfaces.yaml 摘要与 frozen_inputs 不符。
  - id: rule_set_drift
    rule: policy.check 的 rule_set_hash 与冻结时不同（含 policies/ 下任何规则字节变化）。
  - id: tool_version_drift
    rule: structure_metrics 的 schema_version 不是 1.1。
  - id: start_not_clean
    rule: run 起点 HEAD 与 run-manifest 不符，或工作树不干净（装配文件 .policy/** 除外）。
  - id: nondeterminism
    rule: 同一输入两次读数不逐字节相同（H4 人工裁定哪一份有效）。
  - id: external_write
    rule: 判据运行期间出现未声明的写者（封条 pre != post）。
  - id: budget_truncated
    rule: pre_evidence / hooks 预算被截断或 T 子进程超时且未显式记「跑不成」。
  - id: over_one_third_invalid
    rule: 同一题作废 run 超过总数 1/3 => 该题整套「跑不成」。

human_items:
  - {id: H1, item: 隐藏验收作者标识 + 是否看过实施 diff, recorded_in: run-record.hidden_author}
  - {id: H2, item: 测试削弱抽样（把断言改弱自动抓不到）, recorded_in: run-record.bypass_sampling}
  - {id: H3, item: 组合根语义（A4 只回答实例化位置）, recorded_in: run-record.a4_review}
  - {id: H4, item: 两次读数不同时的裁定, recorded_in: run-record.nondeterminism_ruling}

treatment:
  note: >-
    本题**未声明对比臂**（SPEC 未给 treatment 变量；本包不声称已激活任何 treatment）。
    真要挂臂，唯一可动的变量仍是 validation/test-layout.yaml 的 production_patterns，由 Lead 另定，
    并在 run-manifest 记注册表 / 配置哈希；未定之前 arms 为空，不把「没有臂」写成「A 臂」。
  arms: {}

readings:
  note: >-
    每题每次 run 记 T/C/A 三个数 + 过程读数（matched/skipped/violations/check_volume/served_checkers）；
    过程读数只做描述，不进 100 分；n=1 只写案例，k>=3 且过预注册规则才可写「值得扩试」。
