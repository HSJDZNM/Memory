# bank-crossmodule-refactor：A3「公开符号最小面」的声明接口上限（--interfaces 的输入）。
#
# 口径（与 tools/structure_metrics.py 的 A3 一致）：每个**非测试层**模块的公开定义数
# （DefinitionFact.private=false，含方法）≤ 这里声明的上限；没声明上限的模块判 fail。
# 测试层不约束（A3_SKIP_LAYERS）；层值为 skip 的文件不在测量范围，也不需要上限。
# __init__ / _helper 这类以下划线开头的名字是 private，不计入（python_ast._is_private）。
#
# 上限 = 接口契约（interfaces.md §2）里的公开面 + 余量：
#   order_repository 改造后 3 个（类 + add + list_all），SPEC §7 指定上限 6（余量 3，容纳 4 个生产文件里的
#     临时/额外公开成员，例如迁移期保留的薄转发在**中间态**出现，最终树必须删掉，A2 判它）；
#   order_service / order_controller 各 3 个（类 + create + list_all），上限 4（余量 1）；
#   order_api 3 个（类 + insert + listing），SPEC §7 指定上限 3（余量 0：门面只该有这两个方法）；
#   src/shop/__init__.py 0 个。
# 未列出的模块（4 个测试文件）不在 A3 范围内。

src/shop/__init__.py: 0
src/shop/order_api.py: 3
src/shop/order_controller.py: 4
src/shop/order_repository.py: 6
src/shop/order_service.py: 4
