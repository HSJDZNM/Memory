# bank-docs-config：最终树（18 文件）→ 层的唯一声明（A 维度，structure_metrics 1.1 的词汇）。
#
# 消费者：python tools/structure_metrics.py --workspace <final-tree> --layers <本文件> --interfaces interfaces.yaml --json
# 层值闭集 = composition / controller / service / repository / model / test / other / skip（未声明层的 .py 会让 A1 fail）。
# 文件集 = 14 个基线文件 + 任务创建的 4 个文件（16 .py 中的每个都在这里；多一个少一个都让「路径族声明 100%」变成假的）。
#
# 列在这里的非 .py 文件用 skip（移出测量范围），不是「没有层」：workspace_scope 需要它是显式声明。
# test：三个基线测试 + 一个改写基线测试（test_check_config）+ 一个新建测试（test_config）；conftest.py 命中 validation/test-layout.yaml 的 test_support_patterns，
# 平台口径的层就是 test（AGENTS 第 49 条）。
# src/shop/__init__.py 是 other（生产代码但无分层角色）。
# model：加载器（纯数据校验，不依赖任何其它层）；composition：只读校验脚本（工具入口）。
# 本题的 .md / .yaml 是**改动面**但不在 A 维度的测量范围里（structure_metrics 只测 .py）。

AGENTS.md: skip
README.md: skip
config/app.yaml: skip
conftest.py: test
docs/config-migration.md: skip
docs/config.md: skip
pytest.ini: skip
src/shop/__init__.py: other
src/shop/config.py: model
src/shop/order_controller.py: controller
src/shop/order_repository.py: repository
src/shop/order_service.py: service
tests/test_check_config.py: test
tests/test_config.py: test
tests/test_order_controller.py: test
tests/test_order_repository.py: test
tests/test_order_service.py: test
tools/check_config.py: composition
