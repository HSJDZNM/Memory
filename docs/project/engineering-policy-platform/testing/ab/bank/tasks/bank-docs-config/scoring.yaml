# bank-docs-config 的评分器（机读规格）
#
# 判据来源：bank/README.md §4.8 与 §6 决策 1；本题 SPEC（tasks/bank-docs-config/SPEC.md）§4/§5/§7。
# 与 dgate2/scorer/scorer.yaml 的关系：只复用 T/C/A=40/30/30 与 C/A 的口径，**不复制字节**；
# dgate2 冻结件一个字节不动。本文件自己的轴 = schema_id + version（bank-scoring，现处 2）。
#
# 冻结状态（读之前先看这条）：C 与 A 两维的判据、输入摘要与文件集**已落盘可复核**；
# T 维已由**独立出题子会话**按 hidden/PLAN.md 落盘 hidden/runner.py 并实测冻结：
# dimension_t.status = frozen、total = 40、case_ids 与 runner 的 CASE_IDS 逐个相等，
# frozen_inputs 的两个 hidden 摘要由实算写入（不是手抄）。**未经 Lead 签字**（frozen_by 仍是
# pending_lead_signature），所以顶层 status = frozen 只表示「T 的判据已冻结」，不表示可开跑。
#
# 形状 = **bank-scoring/2**（2026-10-21 §4.2 收口）：顶层 18 键、frozen_inputs 11 键、dimension_t 13 键；
# 同一版本号下只有一种维度形状——pending 与 frozen 只差取值、不差键集合，顶层 status 是判别符。
# 本题是 frozen：status: frozen、frozen_by: pending_lead_signature、两个 hidden 摘要为实算值。
# dimension_t.case_groups 是实际分组（T 26 + EN 7 + I 7 = 40；逐条见 hidden/PLAN.md）。
# C 维度：ARCH-001 结构性不适用（file_set 无 controller 层）→ 见 dimension_c.not_applicable，
# effective_total = 27；不把 skipped_rules 读成通过。
schema_id: bank-scoring/2
version: "2"
task_id: bank-docs-config
operation_type: 文档 / 配置为主的变更（配置键 retry→retry_policy 迁移 + 加载器 + 校验脚本 + 文档同步）
status: frozen
frozen_by: pending_lead_signature
authority: >-
  本文件由题库冻结包作者子会话按 SPEC 与 bank/README.md §4 写成；C / A 两维的判据与输入摘要已落盘，
  可逐行复核。T 维由**独立出题子会话**按 hidden/PLAN.md 落盘 hidden/runner.py 后同批冻结
  （total 40 / case_ids 与 runner 的 CASE_IDS 逐个相等 / 两个 hidden 摘要实算）。
  **未经 Lead 签字**（frozen_by = pending_lead_signature），不虚构「可开跑」。

invariants:
  - 本文件不含时戳、run id、绝对路径、耗时；相同输入两次读取逐字节相同。
  - 版本轴：schema_id 与 version 配对；加键或改语义必须递增 version，并同批改本文件、
    bank/README.md 与该题的冻结记录（freeze set 的 scorer_input 根覆盖本文件）。
  - 判据的数值（权重、分母、阈值、作废条件）只能出现在本文件；脚本不许另写一份常数。
  - 跨题只比同一条轴；不写总分/均值/百分比/显著性（bank/README.md §5）。
  - 形状（bank-scoring/2）：顶层 18 键、frozen_inputs 11 键、dimension_t 13 键；pending 与 frozen
    只差取值、不差键集合——加键或改语义必须递增 version 并同批改六份 scoring.yaml。
  - dimension_t.freeze_note 在 pending 题里**必须非空**（写明落盘后同批写哪些字段）；null 只属于已冻结题。

weights:
  T: 40
  C: 30
  A: 30

shared_contract: >-
  所有题库题共享同一骨架：T = 隐藏验收通过数（记 passed/total）+ 加权分 round(40 × passed / total)；
  C = 8 条规则 × 3 分（24）+ 冻结文件未改 3 分 + 无旁路 3 分；A = 10 条结构谓词 × 3 分。
  本题的具体取值（T 的 total 待冻结、4 个被测 .py、10 个冻结文件、8 条允许写）在下面逐项写明。

