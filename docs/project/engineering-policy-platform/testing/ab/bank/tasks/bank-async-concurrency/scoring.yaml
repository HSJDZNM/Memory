#
# 判据来源：bank/README.md §4.8 与 §6 决策 1；本题 SPEC.md。与 dgate2/scorer/scorer.yaml 的关系：
# 只复用 T/C/A=40/30/30 与 C/A 的口径，**不复制字节**；dgate2 冻结件一个字节不动。
# 本文件自己的轴 = schema_id + version（bank-scoring，现处 2）。
#
# 冻结状态（读之前先看这一条）：**T / C / A 三维都已冻结**。
#   dimension_t.status = frozen，total = 38，case_ids = T01-T23 / EN1-EN8 / I1-I7；
#   hidden/runner.py 与 hidden/PLAN.md 已落盘并在参考树上实测 38/38（基线 2/38），
#   frozen_inputs 的两个 hidden 摘要是实算值（不是 null、不是空串）。
#   **冻结的是 T 的读数依据，不是 Lead 签字**：frozen_by 仍是 pending_lead_signature。
#
# 形状 = **bank-scoring/2**（2026-10-21 §4.2 收口）：顶层 18 键、frozen_inputs 11 键、dimension_t 13 键；
# 同一版本号下只有一种维度形状——pending 与 frozen 只差取值、不差键集合，顶层 status 是判别符。
# 本题是 frozen：status: frozen、frozen_by: pending_lead_signature、两个 hidden 摘要为实算值。
# C 维度：ARCH-001 结构性不适用（file_set 无 controller 层）→ 见 dimension_c.not_applicable，
# effective_total = 27；不把 skipped_rules 读成通过。
