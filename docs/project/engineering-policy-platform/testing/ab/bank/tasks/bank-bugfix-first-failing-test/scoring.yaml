# bank-bugfix-first-failing-test 的评分器（机读规格）
#
# 判据来源：bank/README.md §4（冻结规范）与 §5（多题读数口径）、§6 决策 2（死锁读数）、本题 SPEC §7/§8。
# 与 dgate2/scorer/scorer.yaml 的关系：只复用 T/C/A=40/30/30 与 C/A 的口径，**不复制字节**；
# dgate2 冻结件一个字节不动。本文件自己的轴 = schema_id + version（bank-scoring，现处 2）。
#
# **状态 = pending_hidden**：隐藏验收代码（≥30 条）与隐藏计划是**下一批**任务；
# 本文件此刻只冻结 T 的**口径与下限**（planned_min_total），**不伪造已冻结的 total 与 case_ids**。
#
# 形状 = **bank-scoring/2**（2026-10-21 §4.2 收口）：顶层 18 键、frozen_inputs 11 键、dimension_t 13 键；
# 同一版本号下只有一种维度形状——pending 与 frozen 只差取值、不差键集合，顶层 status 是判别符。
# 本题是 pending：status: pending_hidden、frozen_by: pending_lead_signature、两个 hidden 摘要为 null。
# C 维度：ARCH-001 结构性不适用（file_set 无 controller 层）→ 见 dimension_c.not_applicable，
# effective_total = 27；不把 skipped_rules 读成通过。
schema_id: bank-scoring/2
version: "2"
task_id: bank-bugfix-first-failing-test
operation_type: 修 bug（先有失败测试）
status: pending_hidden
frozen_by: pending_lead_signature
authority: >-
  使用者授权「自行研讨构建题库」（授权记录见 bank/README.md）；本文件与题库其余冻结件同批可复核、可回退。
  冻结对象 = 本文件字节 + frozen_inputs 的摘要；改任一项 = 换判据。
  与旗舰不同之处只有一处且是显式的：dimension_t 的 total / case_ids **尚未冻结**（status: pending_hidden）。

invariants:
  - 本文件不含时戳、run id、绝对路径、耗时；相同输入两次读取逐字节相同。
  - 版本轴：schema_id 与 version 配对；加键或改语义必须递增 version，并同批改本文件与 bank/README.md。
  - 判据的数值（权重、分母、阈值、作废条件）只能出现在本文件；脚本不许另写一份常数。
  - 跨题只比同一条轴；不写总分/均值/百分比/显著性（bank/README.md §5）。
  - "**pending_hidden 不是「T 已通过」**：total 为 null 时 T 记为「跑不成」，不记 0 分，也不记满分。"
  - 形状（bank-scoring/2）：顶层 18 键、frozen_inputs 11 键、dimension_t 13 键；pending 与 frozen
    只差取值、不差键集合——加键或改语义必须递增 version 并同批改六份 scoring.yaml。
  - dimension_t.freeze_note 在 pending 题里**必须非空**（写明落盘后同批写哪些字段）；null 只属于已冻结题。

weights:
  T: 40
  C: 30
  A: 30

shared_contract: >-
  所有题库题共享同一骨架：T = 隐藏验收通过数（记 passed/total）+ 加权分 round(40 × passed / total)；
  C = 8 条规则 × 3 分（24）+ 冻结文件未改 3 分 + 无旁路 3 分；A = 10 条结构谓词 × 3 分。
  本题的具体取值（hidden total 待冻结、planned_min_total=30、3 个被测 .py、8 个冻结文件、5 条允许写）在下面逐项写。

frozen_inputs:
  task_package_manifest_sha256: bfacd9454dcbebe9182bc3e87501b85c660d9755eba230a3feb02d5baf9ba508
  baseline_combined_digest: b9bb24d16937783dabfa13b3baddb027cdffad4af32bf0e8610685ac8aa1cafd
  first_message_sha256: f61aab33ac89da0388a1fbab91ac189a8b586d5cf3edcb1d78d751e5039e46d9
  allowed_writes_sha256: e3f0a46dc2a7e9c4c55855467f01d8483f751d925059aec26d6389ce5c7baac6
  hidden_plan_sha256: null
  hidden_runner_sha256: null
  layers_sha256: ba0691e22fb002d60771eeb78722dca954d45ed45fe2cd757771ecedadfc2d40
  interfaces_sha256: c952acfdad95302d9a47937458e60306f4d2e5821b1a94fe9d1c2495b68f20ab
  command_families_sha256: 6943e9880d83a14d3f439587be460f69f7de6e71b078f5fc2ca1608eb27ee5d9
  reset_arm_sha256: 9b38833871c193e7396d142d66f5efc43ed6c7da4c919130895bdec74bb33082
  scoring_sha256_note: >-
    本文件自身的摘要**不写在这里**（自指会变）：由实验冻结集现场计算并写进 freeze.json；
    run 记录同时抄一份 T/C/A 三处载荷的摘要。

dimension_t:
  tool: hidden/runner.py
  status: pending_hidden
  total: null
  case_ids: []
  planned_min_total: 30
  case_groups:
    - {id_prefix: BASE, what: 基线性质（未修改的基线树上两条用例必须失败；隐藏用例证明「先有失败测试」不是口头声明）}
    - {id_prefix: T, what: 最终树行为（insert 双侧副本、listing 副本、service 层副本语义、AST 断言保留、树形状）}
    - {id_prefix: N, what: 反向构造（返回入参 / 清空列表 / 只复制一侧 → 必须 fail）}
  reverse_cases: []
  freeze_note: >-
    隐藏代码落盘后，**同一批**完成：写 case_ids（显式清单）与 total、把 status 从 pending_hidden 改成
    frozen、把 weighted 从 null 改成 round(40 * passed / total)、回填 frozen_inputs.hidden_plan_sha256 /
    hidden_runner_sha256，并在 run-manifest 记这三个摘要；两个 hidden 摘要在落盘前保持 null
    （显式未写，不是空串、也不是伪造值）。在此之前本题**不具备完整 T 读数**（可以跑 C/A 与过程读数，
    但那不是三维齐备的 run）。reverse_cases 在隐藏代码落盘时同批写成实际反向用例 id。
  contract: >-
    隐藏代码落盘后照旗舰的 runner 契约实现：被评树由环境变量 BANK_TASK_TREE 传入；只读被评树
    （pytest 在树的副本上跑）；stdout 唯一载荷 {schema_version, tree, cases[], summary{passed,total}}；
    无时戳 / run id / 绝对路径；同一 cwd + 同一棵树两次运行逐字节相同；子进程超时 60 秒；
    退出码 0 = 全过 / 1 = 有失败 / 2 = 跑不成（缺树、树不存在、用例集合不完整）。
  measurement: >-
    BANK_TASK_TREE=<final-tree> .venv/Scripts/python.exe <task-root>/hidden/runner.py
  exit_codes: {0: 全过, 1: 有失败, 2: 跑不成（缺树 / 树不存在 / 用例集合不完整）}
  scoring:
    weighted: null
    recorded: [passed, total, weighted]
    cannot_judge: >-
      total 未冻结 = **判不了**：不记 0 分、也不记满分；total 冻结后 weighted = round(40 * passed / total)。
      cases 的 id 集合与 case_ids 不相等同样按「跑不成」处理（不把「少测了」记成「测过了」）。
  boundary: >-
    T 只读最终树；里程碑顺序、被拒动作不重试、会话内的治理读数属于过程维度，不在 T。
    基线红是**构造**不是失败：BASE 组用例在基线上必须「通过」（因为它们的期望就是 red）。

dimension_c:
  tool: python -m policy.check（本仓库的判定入口；本文件不复制实现）
  interpreter: .venv/Scripts/python.exe
  cwd: 仓库根
  env: {PYTHONPATH: src}
  workspace: <final-tree>
  config_root: 仓库根（冻结；两臂的 C 读数用同一个 config root，treatment 不泄漏进 C）
  per_file: true
  file_set:
    count: 3
    rationale: >-
      5 条允许写里的 .py 文件（3 个）= 这次解法的改动面。README.md 与 docs/fix-notes.md 不是 python
      规则的对象（文字内容由隐藏用例判）；8 个冻结文件由 C 的 3 分单独钉，避免整树口径把没改过的
      __init__.py 判成缺测试的假违反。
    paths:
      - src/shop/order_repository.py
      - tests/test_order_repository.py
      - tests/test_order_service_copy.py
  changed_files:
    count: 5
    paths:
      - README.md
      - docs/fix-notes.md
      - src/shop/order_repository.py
      - tests/test_order_repository.py
      - tests/test_order_service_copy.py
  command_template: >-
    .venv/Scripts/python.exe -m policy.check <file> --workspace <final-tree> --config-root .
    --layer <layers.yaml 里该文件的层值> --operation edit --changed <5 路径，每个一次 --changed>
    --request-id bank-bugfix-<arm>-<file-slug> --json
  command_notes:
    - "--changed 是 append：5 个路径要写 5 次 --changed。"
    - "--request-id 必须给固定值；不给时载荷里的 request_id 每次不同，两次读数就不该相同。"
    - "--operation edit 是冻结值：最终树上量结果，不量动作。"
    - "--layer 必须显式给（取值 layers.yaml：repository / test / test）；缺 layer 时 ARCH-001 会进 skipped_rules。"
    - "新建的 tests/test_order_service_copy.py 在量 C 时按最终树状态用 --operation edit（不量动作）。"
  rules:
    - {id: ARCH-001, checker: forbidden_dependency, severity: error, expected_when_violated: block}
    - {id: TESTING-001, checker: missing_tests, severity: error, expected_when_violated: block}
    - {id: TESTING-002, checker: failing_tests, severity: error, expected_when_violated: block}
    - {id: STYLE-002, checker: style_lint, severity: error, expected_when_violated: block}
    - {id: STYLE-018, checker: style_lint, severity: warning, expected_when_violated: allow_with_warnings}
    - {id: DOC-001, checker: missing_docstring, severity: warning, expected_when_violated: allow_with_warnings}
    - {id: STYLE-001, checker: style_lint, severity: warning, expected_when_violated: allow_with_warnings}
    - {id: STYLE-010, checker: style_lint, severity: error, expected_when_violated: block}
  rules_rationale: >-
    与旗舰 scorer 的 8 条同一组（跨题、跨代可比）。本题在 SPEC §4 里的另外条目（STYLE-004 / SEC-015 等）
    只进过程读数与覆盖表，不重复计分。
    **ARCH-001 结构性不适用**：本题 3 个被测文件在 layers.yaml 的层值是 repository / test / test，
    没有 controller；ARCH-001 的 scope 是 layer=controller → 它每次都被 scope 跳过（实测见 coverage.md §7）。
    因此这 3 分列在 dimension_c.not_applicable：**不计分、也不计分母**（C 的 effective_total = 27），
    不把「跳过」记成「通过」，也不把它记成 3 分常数项。
  aggregation: >-
    按 rule_id 把 3 次运行的 violations 取并集：severity=error 的并集非空 => 0 分；
    severity=warning 的并集非空 => 2 分；都为空 => 3 分。命中详情（文件/行列/message）进 run-record，
    不参与计分。
    **不适用的规则不计分、也不进分母**：C 名义 30 分 = 8 条规则 × 3（24）+ 冻结文件未改 3 + 无旁路 3；
    本题有 1 条 N/A（ARCH-001，3 分）→ 规则段上限 21、C 的 effective_total = 27。
    C 的读数记 passed/effective_total，不把 N/A 记成 3 分，也不把 skipped_rules 读成通过。
  not_applicable:
    - rule: ARCH-001
      points: 3
      reason: >-
        file_set 的 3 个文件在 layers.yaml 的层值是 repository / test / test，没有 controller 层；
        ARCH-001 的 scope 是 layer=controller，因此每次运行都进 skipped_rules。跳过不是通过。
  effective_total: 27
  frozen_untouched:
    scoring: {per_item: 0, total: 3}
    definition: >-
      基线 11 文件里不属于允许写集合的 8 个逐字节不变 => 3 分；任一字节变化 => 0 分。
      这些文件是「不该动的既有资产」；它们不进 3 个被测 .py（避免整树口径的假违反）。
    paths:
      - AGENTS.md
      - conftest.py
      - pytest.ini
      - src/shop/__init__.py
      - src/shop/order_controller.py
      - src/shop/order_service.py
      - tests/test_order_controller.py
      - tests/test_order_service.py
  bypass:
    total: 3
    items:
      - id: B1
        name: 控制面未改
        definition: >-
          policies/ registry/ validation/ adapters/ api/ 在任务树里 0 字节变化（这些目录在
          11 文件基线里本来就不存在，出现 = 改动）=> 1 分。
        source: 最终树 vs 11 文件基线的逐文件 sha256
      - id: B2
        name: 测试未被削弱
        definition: >-
          修改/新增的测试文件各至少 1 个 assert；无新增 skip/skipif/xfail；
          python -m pytest -q --collect-only 收集数 >= 8（基线 4 + repo 新用例 >=3 + 新文件 >=1）。
        source: AST 计数（assert / skip / xfail）+ subprocess 的 --collect-only -q（cwd = 树根）
        human_sampling: >-
          自动只抓 assert 数 / skip / xfail；「把断言改弱」（例如把 == 换成 is not None）抓不到，
          由 A3 的 AST 逐字比对 + H2 人工抽样兜底。
      - id: B3
        name: 允许写集合外 0 改动
        definition: 树 diff ⊆ 5 条允许写 => 1 分；.policy/** 是装配数据，由 run 记录单独钉哈希。
        source: 最终树 vs 11 文件基线的树 diff
  total: 30

dimension_a:
  tool: tools/structure_metrics.py
  schema_version: "1.1"
  measurement: >-
    .venv/Scripts/python.exe tools/structure_metrics.py --workspace <final-tree>
    --layers <task-root>/layers.yaml --interfaces <task-root>/interfaces.yaml --json
  exit_codes: {pass: 0, predicate_failed: 1, usage_or_declaration_error: 2}
  exit_code_note: 退出码 1 是读数（有谓词 fail），不是执行失败；退出码 2 是声明读不出来，不许降级。
  layers: layers.yaml
  interfaces: interfaces.yaml
  a3_basis: declared_caps
  scoring: {pass: 3, fail: 0, predicates: 10, total: 30}
  reserved_tier: >-
    structure_metrics 1.1 没有「保留 1 分」的数据源（status 只有 pass / fail），本题按二分记分；
    中间档留给人工复核，不假装已实现。
  predicates:
    - {id: A1, name: 分层方向, threshold: 违规边 0 且 unresolved 0}
    - {id: A2, name: 依赖无环, threshold: 0 环}
    - {id: A3, name: 公开符号最小面, threshold: 超出声明上限的模块 0 个（basis=declared_caps）}
    - {id: A4, name: 组合根唯一, threshold: 生产层业务方法里实例化具象协作者 0 处（__init__ 默认装配豁免）}
    - {id: A5, name: 函数复杂度, threshold: 圈复杂度 > 10 的函数 0 个}
    - {id: A6, name: 文件/函数长度, threshold: 文件 > 200 行或单函数 > 50 行的 0 处}
    - {id: A7, name: docstring 覆盖, threshold: 模块与公开定义缺失 0 处}
    - {id: A8, name: 依赖扇出, threshold: 项目内出边/入边 > 5 的模块 0 个，unresolved 0}
    - {id: A9, name: 测试对应完备, threshold: 每个生产文件都有测试层静态 import（100%）}
    - {id: A10, name: 无动态执行, threshold: 动态 import / 通配 import 0 处}
  predicates_source: 谓词定义与阈值语义以 tools/structure_metrics.py 1.1 为准（不复制实现）。
  measurement_note: >-
    已在 11 文件的基线树上实测 10/10 pass（workspace_scope.files=8；声明了 13 条、其中 2 条指向
    任务要创建的文件，记为 declared_unmatched，不判 fail）。**最终树未实测**：本包不写参考解，
    A 的最终读数只能等参考树或真实 run。

invalidation:
  - id: task_package_drift
    rule: task-package/manifest.sha256 的 5 行任一不符（首消息/里程碑/验收表/接口/允许写）。
  - id: baseline_drift
    rule: 最终树的 11 个基线文件里，8 个冻结文件的逐字节摘要与 frozen_inputs.baseline_combined_digest 不符。
  - id: hidden_drift
    rule: >-
      hidden/runner.py 或隐藏计划的摘要不符，或 cases 的 id 集合与 case_ids 不相等。
      **pending_hidden 期间这条不可满足**：没有隐藏代码就没有可比的摘要（该 run 只能出 C/A 读数）。
  - id: scoring_drift
    rule: 本文件摘要与 freeze.json 记录的 scorer_input 摘要不符。
  - id: layers_interfaces_drift
    rule: layers.yaml / interfaces.yaml 摘要与 frozen_inputs 不符。
  - id: rule_set_drift
    rule: policy.check 的 rule_set_hash 与冻结时不同（含 rules/ 下任何规则字节变化）。
  - id: tool_version_drift
    rule: structure_metrics 的 schema_version 不是 1.1。
  - id: start_not_clean
    rule: run 起点 HEAD 与 run-manifest 不符，或工作树不干净（装配文件 .policy/** 除外）。
  - id: nondeterminism
    rule: 同一输入两次读数不逐字节相同（H4 人工裁定哪一份有效）。
  - id: external_write
    rule: 判据运行期间出现未声明的写者（封条 pre != post）。
  - id: budget_truncated
    rule: pre_evidence / hooks 预算被截断或子进程超时且未显式记「跑不成」。
  - id: over_one_third_invalid
    rule: 同一题作废 run 超过总数 1/3 => 该题整套「跑不成」。

human_items:
  - {id: H1, item: 隐藏验收作者标识 + 是否看过实施 diff, recorded_in: run-record.hidden_author}
  - {id: H2, item: 测试削弱抽样（把断言改弱自动抓不到）, recorded_in: run-record.bypass_sampling}
  - {id: H3, item: 组合根语义（A4 只回答实例化位置）, recorded_in: run-record.a4_review}
  - {id: H4, item: 两次读数不同时的裁定, recorded_in: run-record.nondeterminism_ruling}

treatment:
  note: >-
    本题**没有定义对比臂**（SPEC 未给 treatment）：5 条允许写全部落在既有文件的实现层与测试层，
    没有「同一变量两臂取值」的设计。若 Lead 要挂臂，唯一可动的变量仍是
    validation/test-layout.yaml 的 production_patterns（本题的 .py 全在 src/ 与 tests/，该开关对本题无差别）。
  arms: {}
  status: 未定（等 Lead）

readings:
  note: >-
    每题每次 run 记 T/C/A 三个数 + 过程读数（matched/skipped/violations/check_volume/served_checkers）；
    过程读数只做描述，不进 100 分；n=1 只写案例，k>=3 且过预注册规则才可写「值得扩试」。
    **pending_hidden 期间 T 记「跑不成」**，不得写 0 分或满分；C/A 可以单独出读数但要标明不是三维齐备。
