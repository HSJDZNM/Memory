# 规范治理价值测试 · 外部数据集登记（草案 v0.1）
#
# 这是**评测资产的数据**，不是代码：新增/移除语料只改这里（与 knowledge/corpus.yaml 同型）。
# 字段口径：
#   tier            A=本次已核验（存在性/布局/许可元数据）  B=仅搜索结果可见，未核验  C=只作哨兵，不作门槛
#                   （2026-10-07 修订）B 现在有两种成因：① 还没核验；② **核验过但不予采信**——
#                   同构程度 / 许可原文 / 漂移处置未过。两者都**不得进任何门槛**，区别写在各自的 verified 里。
#   role            这条语料服务哪些工作包与指标（W*/GV-*）
#   entry           入口 URL
#   kind            git | hf | web | local
#   pin             钉死方式（commit / dataset revision / 文件 sha256）——**必须钉死**，不许跟 HEAD
#   license         许可；license_verified=false 时不得入仓、不得分发
#   labels          ground truth 的粒度（决定能算什么指标、不能算什么指标）
#   verified        本次核验到什么程度（核验过什么、什么时候）
#   admission_todo  准入前还欠的检查（**空列表才允许进门槛**）
#   cannot_prove    这条语料**证明不了**什么（写在数据里，避免被引用时越界）
#
# 两条硬纪律：
#   1. 不许自证：任何价值结论的标签不得来自平台自己的 Decision；本文件里只有 W1/W2/W6 的语料属于 L1 保真度，
#      它不是 L3 价值。
#   2. 不入库：GPL / LGPL / other 的语料只在运行期取到 .tmp/eval-corpora/<id>@<rev>/，
#      仓库里只提交 evaluation/corpora/<id>.lock.json（上游 revision + 逐文件 sha256）。漂移不许静默。

# 三条纪律（2026-10-07 补）：
#   3. 这是**唯一**的数据集登记表：`evaluation/` 下不再放第二份 datasets.yaml（方案 §7 的旧布局已改），
#      `tools/eval_corpus.py` 的 SourceSpec.registry_ref 指向本文件的条目 id。
#   4. 每条语料必须写清**标注粒度**（行级 / 定义级 / 文件级 / 片段级）：粒度不同，能算的指标不同，
#      片段级标注**不得**进入 GV-01 / GV-02 的分母（见方案 §4.5 与 §4.6）。
#   5. 每条规则必须有样本量 N；N = 0 的规则进方案 §4.5 的「本次无外部标签」清单，不许写成「已覆盖」。
#   6. **判据对象必须同构**（2026-10-07 补，R3 判定）：评论级 / 意见级标签与「平台在这一点有没有命中某条规则」
#      不是一回事，不得进 GV-01 / GV-02 分母，也不得作 L2 的 TP / FP / FN 来源（方案 §4.7）；
#      这类语料只能当**抽样框**或产**描述性计数**（GV-16）。

